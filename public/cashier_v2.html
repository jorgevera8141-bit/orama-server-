<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orama Café - Caja</title>
<style>
  :root{--teal:#1aab85;--dark:#0d6b54;--brown:#2d1a0e;--light:#e8f8f4;--gray:#666;--border:#ddd;--amber:#E8A45A;--red:#D46B6B}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f0f7f4;max-width:480px;margin:0 auto}
  .header{background:linear-gradient(135deg,#0d6b54,#1aab85);color:white;padding:20px;text-align:center}
  .header h1{font-size:22px;font-family:Georgia,serif;letter-spacing:2px}
  .header p{font-size:12px;opacity:0.8;margin-top:4px}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
  .summary-card{background:white;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
  .summary-value{font-size:24px;font-weight:700;color:var(--teal)}
  .summary-label{font-size:11px;color:var(--gray);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}
  .section-title{font-size:13px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.5px;padding:8px 16px}
  .order-card{background:white;border-radius:12px;padding:14px 16px;margin:0 16px 10px;box-shadow:0 1px 4px rgba(0,0,0,0.08);border-left:4px solid var(--teal)}
  .order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .order-mesa{font-size:15px;font-weight:700;color:var(--brown)}
  .order-total{font-size:18px;font-weight:700;color:var(--teal)}
  .order-time{font-size:11px;color:var(--gray);margin-bottom:8px}
  .order-items{font-size:12px;color:var(--gray);margin-bottom:10px;line-height:1.8}
  .pay-btn{width:100%;background:linear-gradient(135deg,#0d6b54,#1aab85);color:white;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer}
  .empty{text-align:center;padding:40px;color:var(--gray)}
  .refresh-btn{background:rgba(255,255,255,0.2);border:none;border-radius:20px;padding:6px 14px;color:white;font-size:12px;cursor:pointer;margin-top:8px}
  .spinner{width:24px;height:24px;border:2px solid rgba(26,171,133,0.3);border-top-color:var(--teal);border-radius:50%;animation:spin 0.75s linear infinite;margin:20px auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* PAYMENT MODAL */
  .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:white;border-radius:20px 20px 0 0;padding:20px 20px 40px;width:100%;max-width:480px}
  .modal-title{font-size:18px;font-weight:700;color:var(--brown);margin-bottom:4px}
  .modal-total{font-size:32px;font-weight:700;color:var(--teal);margin-bottom:16px}
  .modal-mesa{font-size:13px;color:var(--gray);margin-bottom:16px}
  .pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .pay-method{background:#f5f5f5;border:2px solid transparent;border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--gray)}
  .pay-method.selected{background:var(--light);border-color:var(--teal);color:var(--teal)}
  .pay-method-icon{font-size:22px;display:block;margin-bottom:4px}
  .payment-fields{margin-bottom:16px}
  .field-group{margin-bottom:12px}
  .field-label{font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.4px;display:block;margin-bottom:5px}
  .field-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:16px;font-family:Arial,sans-serif;outline:none}
  .field-input:focus{border-color:var(--teal)}
  .cambio-display{background:var(--light);border-radius:10px;padding:12px 14px;text-align:center;margin-bottom:12px}
  .cambio-label{font-size:12px;color:var(--gray);margin-bottom:4px}
  .cambio-value{font-size:24px;font-weight:700;color:var(--teal)}
  .cambio-value.negative{color:var(--red)}
  .confirm-btn{width:100%;background:linear-gradient(135deg,#0d6b54,#1aab85);color:white;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:8px}
  .confirm-btn:disabled{background:#ccc}
  .cancel-modal-btn{width:100%;background:none;border:1.5px solid var(--border);border-radius:12px;padding:12px;font-size:14px;font-weight:600;color:var(--gray);cursor:pointer}
  .split-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="header">
  <h1>🌿 ORAMA CAFÉ</h1>
  <p>Caja</p>
  <button class="refresh-btn" onclick="loadAll()">↻ Actualizar</button>
</div>
<div class="summary">
  <div class="summary-card">
    <div class="summary-value" id="total-ordenes">0</div>
    <div class="summary-label">Ordenes hoy</div>
  </div>
  <div class="summary-card">
    <div class="summary-value" id="total-ventas">$0</div>
    <div class="summary-label">Ventas hoy</div>
  </div>
</div>
<div class="section-title">Ordenes activas</div>
<div id="orders-list"><div class="spinner"></div></div>

<!-- PAYMENT MODAL -->
<div class="modal-overlay" id="payment-modal">
  <div class="modal">
    <div class="modal-mesa" id="modal-mesa">Mesa 1</div>
    <div class="modal-title">Total a cobrar</div>
    <div class="modal-total" id="modal-total">$0.00</div>

    <div class="pay-methods">
      <div class="pay-method selected" onclick="selectMethod('efectivo')">
        <span class="pay-method-icon">💵</span>
        Efectivo
      </div>
      <div class="pay-method" onclick="selectMethod('tarjeta')">
        <span class="pay-method-icon">💳</span>
        Tarjeta
      </div>
      <div class="pay-method" onclick="selectMethod('mixto')">
        <span class="pay-method-icon">🔀</span>
        Mixto
      </div>
    </div>

    <div class="payment-fields" id="payment-fields">
      <!-- Dynamic fields based on method -->
    </div>

    <button class="confirm-btn" id="confirm-btn" onclick="confirmarPago()">✅ Confirmar cobro</button>
    <button class="cancel-modal-btn" onclick="closeModal()">Cancelar</button>
  </div>
</div>

<script>
let currentOrdenId = null;
let currentTotal = 0;
let currentMethod = 'efectivo';

async function loadAll(){
  await Promise.all([loadOrders(), loadSummary()]);
}

async function loadOrders(){
  try{
    const res = await fetch("/api/ordenes");
    const orders = await res.json();
    const list = document.getElementById("orders-list");
    if(!orders.length){
      list.innerHTML="<div class='empty'>No hay ordenes activas</div>";
      return;
    }
    let html = "";
    for(const o of orders){
      const itemsRes = await fetch("/api/ordenes/"+o.id+"/items");
      const items = await itemsRes.json();
      html += "<div class='order-card'>";
      html += "<div class='order-header'><span class='order-mesa'>"+o.mesa_nombre+"</span><span class='order-total'>$"+parseFloat(o.total).toFixed(2)+"</span></div>";
      html += "<div class='order-time'>"+new Date(o.created_at).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})+"</div>";
      html += "<div class='order-items'>"+items.map(i=>"x"+i.cantidad+" "+i.item_nombre).join("<br>")+"</div>";
      html += "<button class='pay-btn' onclick='openPayment("+o.id+",\""+o.mesa_nombre+"\","+parseFloat(o.total)+")'>💳 Cobrar</button>";
      html += "</div>";
    }
    list.innerHTML = html;
  }catch(e){
    document.getElementById("orders-list").innerHTML="<div class='empty'>Error al cargar</div>";
  }
}

async function loadSummary(){
  try{
    const res = await fetch("/api/resumen");
    const data = await res.json();
    document.getElementById("total-ordenes").textContent = data.ordenes||0;
    document.getElementById("total-ventas").textContent = "$"+parseFloat(data.total||0).toFixed(2);
  }catch(e){}
}

function openPayment(id, mesa, total){
  currentOrdenId = id;
  currentTotal = total;
  currentMethod = 'efectivo';
  document.getElementById("modal-mesa").textContent = mesa;
  document.getElementById("modal-total").textContent = "$"+total.toFixed(2);
  document.getElementById("payment-modal").classList.add("open");
  document.querySelectorAll(".pay-method").forEach((m,i)=>m.classList.toggle("selected",i===0));
  renderPaymentFields();
}

function closeModal(){
  document.getElementById("payment-modal").classList.remove("open");
  currentOrdenId = null;
}

function selectMethod(method){
  currentMethod = method;
  const methods = ['efectivo','tarjeta','mixto'];
  document.querySelectorAll(".pay-method").forEach((m,i)=>m.classList.toggle("selected",methods[i]===method));
  renderPaymentFields();
}

function renderPaymentFields(){
  const fields = document.getElementById("payment-fields");
  if(currentMethod === 'efectivo'){
    fields.innerHTML = `
      <div class="field-group">
        <label class="field-label">Cantidad recibida</label>
        <input type="number" class="field-input" id="efectivo-input" placeholder="$0.00" oninput="calcCambio()" step="0.01">
      </div>
      <div class="cambio-display">
        <div class="cambio-label">Cambio a entregar</div>
        <div class="cambio-value" id="cambio-value">$0.00</div>
      </div>`;
  } else if(currentMethod === 'tarjeta'){
    fields.innerHTML = `<div style="background:var(--light);border-radius:10px;padding:14px;text-align:center;margin-bottom:12px"><span style="font-size:13px;color:var(--teal);font-weight:600">Cobrar $${currentTotal.toFixed(2)} con tarjeta</span></div>`;
  } else if(currentMethod === 'mixto'){
    fields.innerHTML = `
      <div class="split-row">
        <div class="field-group">
          <label class="field-label">Efectivo</label>
          <input type="number" class="field-input" id="mixto-efectivo" placeholder="$0.00" oninput="calcMixto()" step="0.01">
        </div>
        <div class="field-group">
          <label class="field-label">Tarjeta</label>
          <input type="number" class="field-input" id="mixto-tarjeta" placeholder="$0.00" oninput="calcMixto()" step="0.01">
        </div>
      </div>
      <div class="cambio-display">
        <div class="cambio-label">Restante / Cambio</div>
        <div class="cambio-value" id="mixto-restante">$0.00</div>
      </div>`;
  }
}

function calcCambio(){
  const recibido = parseFloat(document.getElementById("efectivo-input").value) || 0;
  const cambio = recibido - currentTotal;
  const el = document.getElementById("cambio-value");
  el.textContent = "$"+Math.abs(cambio).toFixed(2)+(cambio < 0 ? " (faltan)" : "");
  el.className = "cambio-value"+(cambio < 0 ? " negative" : "");
}

function calcMixto(){
  const ef = parseFloat(document.getElementById("mixto-efectivo").value) || 0;
  const ta = parseFloat(document.getElementById("mixto-tarjeta").value) || 0;
  const restante = currentTotal - ef - ta;
  const el = document.getElementById("mixto-restante");
  el.textContent = "$"+Math.abs(restante).toFixed(2)+(restante > 0 ? " pendiente" : restante < 0 ? " cambio" : " ✅ exacto");
  el.className = "cambio-value"+(restante > 0 ? " negative" : "");
}

async function confirmarPago(){
  if(currentMethod === 'efectivo'){
    const recibido = parseFloat(document.getElementById("efectivo-input").value) || 0;
    if(recibido < currentTotal){ alert("La cantidad recibida es menor al total"); return; }
  }
  if(currentMethod === 'mixto'){
    const ef = parseFloat(document.getElementById("mixto-efectivo").value) || 0;
    const ta = parseFloat(document.getElementById("mixto-tarjeta").value) || 0;
    if(ef + ta < currentTotal){ alert("La suma no cubre el total"); return; }
  }
  await fetch("/api/ordenes/"+currentOrdenId+"/cerrar",{method:"PUT"});
  closeModal();
  loadAll();
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
