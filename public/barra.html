<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orama Café - Barra</title>
<link rel="stylesheet" href="/css/orama.css">
<style>
  /* barra is the barista bar display — kept dark on purpose (wall-mounted,
     low glare). Dark surfaces are local overrides; brand + status colors
     still come from orama.css tokens. */
  :root{
    --bar-bg:#1a1a1a;
    --bar-card:#2d2d2d;
    --bar-line:#3d3d3d;
    --bar-text:#dddddd;
    --bar-text-dim:#888888;
  }
  body{background:var(--bar-bg);color:var(--bar-text);max-width:600px;margin:0 auto;min-height:100vh}

  .header{background:var(--brand-gradient);color:#fff;padding:var(--space-3) 20px;display:flex;justify-content:space-between;align-items:center}
  .header h1{color:#fff;font-size:var(--text-lg);font-family:var(--font-brand);letter-spacing:2px}
  .header-right{text-align:right}
  .time{font-size:18px;font-weight:700}
  .refresh-btn{background:rgba(255,255,255,0.2);border:none;border-radius:20px;padding:5px 12px;color:#fff;font-size:var(--text-xs);cursor:pointer;margin-top:4px;display:block}
  .counter{background:var(--bar-card);padding:10px 20px;display:flex;gap:20px}
  .counter-item{text-align:center}
  .counter-value{font-size:22px;font-weight:700;color:var(--teal)}
  .counter-label{font-size:10px;color:var(--bar-text-dim);text-transform:uppercase;letter-spacing:0.5px}
  .orders-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;padding-bottom:40px}
  .order-card{background:var(--bar-card);border-radius:14px;overflow:hidden;border:2px solid var(--bar-line)}
  .order-card.urgent{border-color:var(--warning)}
  .order-header{background:var(--bar-line);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  .order-mesa{font-size:var(--text-md);font-weight:700;color:#fff}
  .order-time-badge{font-size:var(--text-xs);font-weight:700;padding:3px 8px;border-radius:10px;background:var(--teal);color:#fff}
  .order-time-badge.urgent{background:var(--warning);color:#fff}
  .order-items{padding:12px 14px}
  .order-item{display:flex;align-items:center;gap:var(--space-2);padding:6px 0;border-bottom:1px solid var(--bar-line)}
  .order-item:last-child{border-bottom:none}
  .item-qty{background:var(--teal);color:#fff;border-radius:6px;padding:2px 7px;font-size:var(--text-sm);font-weight:700;flex-shrink:0}
  .item-name{font-size:var(--text-sm);color:var(--bar-text);flex:1}
  .ready-btn{width:100%;background:var(--brand-gradient);color:#fff;border:none;padding:10px;font-size:var(--text-sm);font-weight:700;cursor:pointer;margin-top:2px}
  .ready-btn:active{background:var(--teal-dark)}
  .empty{text-align:center;padding:60px 20px;color:#666}
  .empty-icon{font-size:48px;margin-bottom:12px}
  .empty-text{font-size:var(--text-md);color:var(--bar-text-dim)}
  .live-dot{width:8px;height:8px;background:var(--teal);border-radius:50%;display:inline-block;animation:pulse 2s infinite;margin-right:6px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
</style>
</head>
<body>
<div class="header">
  <button class="btn btn--ghost btn--sm" onclick="location.href='/dashboard.html'">← Dashboard</button>
  <div>
    <h1>ORAMA BARRA</h1>
    <div style="font-size:var(--text-xs);opacity:0.7;margin-top:2px"><span class="live-dot"></span>En vivo</div>
  </div>
  <div class="header-right">
    <div class="time" id="clock">--:--</div>
    <button class="refresh-btn" onclick="loadOrders()">Actualizar</button>
  </div>
</div>
<div class="counter">
  <div class="counter-item">
    <div class="counter-value" id="pending-count">0</div>
    <div class="counter-label">Pendientes</div>
  </div>
  <div class="counter-item">
    <div class="counter-value" id="done-count" style="color:var(--bar-text-dim)">0</div>
    <div class="counter-label">Entregadas hoy</div>
  </div>
</div>
<div id="orders-grid" class="orders-grid">
  <div style="grid-column:1/-1;text-align:center;padding:40px"><div class="spinner"></div></div>
</div>

<script src="/js/orama.js"></script>
<script>
let doneCount = 0;

function updateClock(){
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
}

function getElapsed(createdAt){
  const diff = Math.floor((Date.now() - new Date(createdAt)) / 60000);
  if(diff < 1) return "ahora";
  if(diff === 1) return "1 min";
  return diff + " min";
}

async function loadOrders(){
  try{
    const res = await fetch("/api/ordenes");
    const orders = await res.json();
    const grid = document.getElementById("orders-grid");
    document.getElementById("pending-count").textContent = orders.length;

    if(!orders.length){
      grid.innerHTML = '<div style="grid-column:1/-1"><div class="empty"><div class="empty-icon">☕</div><div class="empty-text">Sin ordenes pendientes</div></div></div>';
      return;
    }

    let html = "";
    for(const o of orders){
      const itemsRes = await fetch("/api/ordenes/"+o.id+"/items");
      const items = await itemsRes.json();
      const elapsed = getElapsed(o.created_at);
      const mins = Math.floor((Date.now() - new Date(o.created_at)) / 60000);
      const urgent = mins >= 10;

      html += '<div class="order-card'+(urgent?" urgent":"")+'">';
      html += '<div class="order-header">';
      html += '<span class="order-mesa">'+o.mesa_nombre+'</span>';
      html += '<span class="order-time-badge'+(urgent?" urgent":"")+'">'+elapsed+'</span>';
      html += '</div>';
      html += '<div class="order-items">';
      items.forEach(i=>{
        html += '<div class="order-item"><span class="item-qty">x'+i.cantidad+'</span><span class="item-name">'+i.item_nombre+'</span></div>';
      });
      html += '</div>';
      html += '<button class="ready-btn" onclick="marcarListo('+o.id+')">✅ Listo — Entregar</button>';
      html += '</div>';
    }
    grid.innerHTML = html;
  }catch(e){
    document.getElementById("orders-grid").innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:#666">Error al cargar ordenes</div>';
  }
}

async function marcarListo(id){
  await fetch("/api/ordenes/"+id+"/cerrar",{method:"PUT"});
  doneCount++;
  document.getElementById("done-count").textContent = doneCount;
  loadOrders();
}

updateClock();
setInterval(updateClock, 1000);
loadOrders();
setInterval(loadOrders, 30000);
</script>
</body>
</html>
