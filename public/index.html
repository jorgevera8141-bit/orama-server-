<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orama Café</title>
<link rel="stylesheet" href="/css/orama.css">
<style>
  body{max-width:480px;margin:0 auto}
  .screen{display:none}
  .screen.active{display:block}

  /* MESA */
  .mesa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:var(--space-4) var(--space-3) 100px}
  .mesa-btn{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:20px 10px;text-align:center;cursor:pointer;font-size:var(--text-sm);font-weight:700;color:var(--brown);box-shadow:var(--shadow)}
  .mesa-btn.special{background:linear-gradient(135deg,#e8f8f4,#d0f0e8);border-color:var(--teal);color:var(--teal-dark)}

  /* MENU */
  .mesa-bar{background:var(--brown);color:#fff;padding:var(--space-2) var(--space-3);display:flex;justify-content:space-between;align-items:center}
  .mesa-bar span{font-size:var(--text-sm);font-weight:700}
  .change-btn{background:rgba(255,255,255,0.2);border:none;border-radius:10px;padding:4px 10px;color:#fff;font-size:var(--text-xs);cursor:pointer}
  .search-wrap{padding:10px var(--space-3) 4px;background:var(--surface);border-bottom:1px solid var(--line)}
  .search-input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-size:var(--text-sm);font-family:var(--font-body);outline:none}
  .search-input:focus{border-color:var(--teal)}
  .categories{display:flex;overflow-x:auto;gap:var(--space-2);padding:10px var(--space-3);background:var(--surface);border-bottom:1px solid var(--line)}
  .cat-btn{background:var(--teal-tint);border:none;border-radius:20px;padding:7px 14px;font-size:var(--text-xs);font-weight:600;color:var(--teal);cursor:pointer;white-space:nowrap}
  .cat-btn.active{background-color:var(--teal);color:#fff;background-size:cover;background-position:center}
  .items{padding:10px var(--space-3) 220px}
  .item{background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:var(--space-2);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);border-left:3px solid var(--teal)}
  .item-name{font-size:var(--text-sm);font-weight:600;color:var(--brown)}
  .item-price{font-size:var(--text-xs);color:var(--teal);font-weight:700;margin-top:2px}
  .add-btn{background:var(--teal);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}

  /* CART */
  .cart{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:2px solid var(--teal);box-shadow:0 -4px 20px rgba(0,0,0,0.1)}
  .cart-header{display:flex;justify-content:space-between;align-items:center;padding:10px var(--space-3) 6px;cursor:pointer}
  .cart-count{font-size:var(--text-sm);color:var(--muted)}
  .cart-total{font-size:var(--text-lg);font-weight:700;color:var(--teal)}
  .cart-toggle{font-size:var(--text-xs);color:var(--teal);font-weight:600}
  .cart-items{display:none;max-height:200px;overflow-y:auto;padding:0 var(--space-3) var(--space-2);border-top:1px solid var(--line)}
  .cart-items.open{display:block}
  .cart-item-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f0f0f0}
  .cart-item-row:last-child{border-bottom:none}
  .cart-item-name{font-size:var(--text-sm);color:var(--brown);flex:1}
  .cart-item-qty{font-size:var(--text-xs);color:var(--muted);margin:0 var(--space-2)}
  .cart-item-price{font-size:var(--text-sm);font-weight:700;color:var(--teal);margin-right:var(--space-2)}
  .remove-btn{background:#fbe9e9;border:none;border-radius:50%;width:24px;height:24px;color:var(--error);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cart-btn{width:calc(100% - 32px);margin:6px var(--space-3) 12px;background:var(--brand-gradient);color:#fff;border:none;border-radius:var(--radius);padding:13px;font-size:var(--text-md);font-weight:700;cursor:pointer;display:block}
  .cart-btn:disabled{background:#ccc;cursor:default}
</style>
</head>
<body>
<div class="o-header">
  <button class="btn btn--ghost btn--sm" onclick="location.href='/dashboard.html'" style="margin-bottom:var(--space-2)">← Dashboard</button>
  <h1>🌿 ORAMA CAFÉ</h1>
  <p id="header-sub">Selecciona tu mesa</p>
</div>
<div id="screen-mesas" class="screen active">
  <div style="padding:var(--space-3) var(--space-3) var(--space-2);font-size:var(--text-sm);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">Selecciona tu mesa</div>
  <div class="mesa-grid" id="mesa-grid"><div class="spinner" style="grid-column:1/-1"></div></div>
</div>

<div id="screen-menu" class="screen">
  <div class="mesa-bar">
    <span id="mesa-label">Mesa 1</span>
    <button class="change-btn" onclick="changeMesa()">Cambiar mesa</button>
  </div>
  <div class="search-wrap">
    <input type="text" class="search-input" placeholder="🔍 Buscar producto..." oninput="searchItems(this.value)" id="search-input">
  </div>
  <div class="categories" id="categories"></div>
  <div class="items" id="items"><div class="spinner"></div></div>
  <div class="cart">
    <div class="cart-header" onclick="toggleCart()">
      <span class="cart-count" id="cart-count">0 articulos</span>
      <span class="cart-total" id="cart-total">$0.00</span>
      <span class="cart-toggle" id="cart-toggle">Ver ▲</span>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <button class="cart-btn" id="order-btn" disabled onclick="submitOrder()">Ordenar</button>
    <button onclick="cancelarCarrito()" id="cancel-btn" class="btn btn--danger" style="display:none;width:calc(100% - 32px);margin:0 16px 8px">❌ Cancelar orden</button>
  </div>
</div>

<script src="/js/orama.js"></script>
<script>
let menu=[],cart=[],currentCat="Todos",mesaId=null,mesaNombre="",cartOpen=false,searchQuery="";

async function loadMesas(){
  const res=await fetch("/api/mesas");
  const mesas=await res.json();
  const grid=document.getElementById("mesa-grid");
  if(!mesas.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1"><span class="empty__icon">🍽️</span>No hay mesas configuradas</div>';return;}
  grid.innerHTML=mesas.map(m=>
    '<button class="mesa-btn'+(m.nombre==="Barra"||m.nombre==="Boutique"?" special":"")+'" onclick="selectMesa('+m.id+',this.textContent)">'+m.nombre+'</button>'
  ).join("");
}

function selectMesa(id,nombre){
  mesaId=id;mesaNombre=nombre;
  document.getElementById("mesa-label").textContent=nombre;
  document.getElementById("header-sub").textContent="- "+nombre+" -";
  document.getElementById("screen-mesas").classList.remove("active");
  document.getElementById("screen-menu").classList.add("active");
  if(!menu.length) loadMenu();
}

function changeMesa(){
  document.getElementById("screen-menu").classList.remove("active");
  document.getElementById("screen-mesas").classList.add("active");
  document.getElementById("header-sub").textContent="Selecciona tu mesa";
  cart=[];updateCart();
}

// one photo per category (only where a matching image exists)
const CAT_IMG={
  'Cafe Espresso y Chocolate':'/images/espresso-pour.jpeg',
  'Especialidades de Cafe':'/images/espresso-pour.jpeg',
  'Reposteria':'/images/pastries-croissants.jpeg',
  'Tes':'/images/iced-tea.jpeg',
  'Fuente de Sodas':'/images/iced-tea.jpeg'
};
function paintCats(){
  document.querySelectorAll(".cat-btn").forEach(b=>{
    const img=b.classList.contains("active") && CAT_IMG[b.textContent];
    b.style.backgroundImage = img
      ? "linear-gradient(rgba(13,107,84,0.68),rgba(13,107,84,0.68)), url('"+img+"')"
      : "";
  });
}

async function loadMenu(){
  const res=await fetch("/api/menu");
  menu=await res.json();
  const cats=["Todos",...new Set(menu.map(i=>i.categoria))];
  document.getElementById("categories").innerHTML=cats.map(c=>
    '<button class="cat-btn'+(c==="Todos"?" active":"")+'" onclick="filterCat(this.textContent)">'+c+'</button>'
  ).join("");
  paintCats();
  renderItems();
}

function filterCat(cat){
  currentCat=cat;
  searchQuery="";
  document.getElementById("search-input").value="";
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.toggle("active",b.textContent===cat));
  paintCats();
  renderItems();
}

function searchItems(q){
  searchQuery=q;
  currentCat="Todos";
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.toggle("active",b.textContent==="Todos"));
  paintCats();
  renderItems();
}

function renderItems(){
  let filtered=menu;
  if(searchQuery) filtered=menu.filter(i=>i.nombre.toLowerCase().includes(searchQuery.toLowerCase()));
  else if(currentCat!=="Todos") filtered=menu.filter(i=>i.categoria===currentCat);
  document.getElementById("items").innerHTML=filtered.map(i=>
    '<div class="item"><div><div class="item-name">'+i.nombre+'</div><div class="item-price">$'+parseFloat(i.precio).toFixed(2)+'</div></div><button class="add-btn" onclick="addToCart('+i.id+')">+</button></div>'
  ).join("")||'<div class="empty"><span class="empty__icon">🔍</span>Sin resultados</div>';
}

function addToCart(id){
  const item=menu.find(i=>i.id===id);
  const ex=cart.find(c=>c.id===id);
  if(ex) ex.cantidad++;
  else cart.push({id,nombre:item.nombre,precio:parseFloat(item.precio),cantidad:1});
  updateCart();
}

function removeFromCart(id){
  const ex=cart.find(c=>c.id===id);
  if(!ex) return;
  if(ex.cantidad>1) ex.cantidad--;
  else cart=cart.filter(c=>c.id!==id);
  updateCart();
}

function toggleCart(){
  cartOpen=!cartOpen;
  document.getElementById("cart-items").classList.toggle("open",cartOpen);
  document.getElementById("cart-toggle").textContent=cartOpen?"Cerrar ▼":"Ver ▲";
}

function updateCart(){
  const total=cart.reduce((s,i)=>s+(i.precio*i.cantidad),0);
  const count=cart.reduce((s,i)=>s+i.cantidad,0);
  document.getElementById("cart-count").textContent=count+" articulo"+(count!==1?"s":"");
  document.getElementById("cart-total").textContent="$"+total.toFixed(2);
  document.getElementById("order-btn").disabled=cart.length===0;
  document.getElementById('cancel-btn').style.display=cart.length>0?'block':'none';
  document.getElementById("cart-items").innerHTML=cart.map(i=>
    '<div class="cart-item-row">'+
    '<span class="cart-item-name">'+i.nombre+'</span>'+
    '<span class="cart-item-qty">x'+i.cantidad+'</span>'+
    '<span class="cart-item-price">$'+(i.precio*i.cantidad).toFixed(2)+'</span>'+
    '<button class="remove-btn" onclick="removeFromCart('+i.id+')">−</button>'+
    '</div>'
  ).join("")||'<div style="padding:10px;color:var(--muted);font-size:var(--text-xs);text-align:center">Carrito vacío</div>';
}

async function cancelarCarrito(){
  if(!(await Orama.confirm('¿Cancelar la orden?',{danger:true,okText:'Sí, cancelar'}))) return;
  cart=[];
  updateCart();
  document.getElementById('cancel-btn').style.display='none';
  changeMesa();
}

async function submitOrder(){
  if(!cart.length) return;
  const btn=document.getElementById("order-btn");
  btn.textContent="Enviando...";btn.disabled=true;
  try{
    const res=await fetch("/api/ordenes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mesa_id:mesaId,mesa_nombre:mesaNombre,items:cart})});
    const data=await res.json();
    cart=[];cartOpen=false;
    document.getElementById("cart-items").classList.remove("open");
    document.getElementById("cart-toggle").textContent="Ver ▲";
    updateCart();
    Orama.toast.success("Orden enviada — Total: $"+parseFloat(data.total).toFixed(2));
  }catch(e){Orama.toast.error("Error al enviar la orden");}
  btn.textContent="Ordenar";btn.disabled=false;
}

loadMesas();
</script>
</body>
</html>
