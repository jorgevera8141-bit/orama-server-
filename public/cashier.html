<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orama Café - Caja</title>
<link rel="stylesheet" href="/css/orama.css">
<style>
  body{max-width:480px;margin:0 auto}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px var(--space-3)}
  .summary-card{background:var(--surface);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
  .summary-value{font-size:24px;font-weight:700;color:var(--teal)}
  .summary-label{font-size:var(--text-xs);color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}
  .section-title{font-size:var(--text-sm);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:var(--space-2) var(--space-3)}
  .order-card{background:var(--surface);border-radius:var(--radius);padding:14px var(--space-3);margin:0 var(--space-3) 10px;box-shadow:var(--shadow);border-left:4px solid var(--teal)}
  .order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .order-mesa{font-size:var(--text-md);font-weight:700;color:var(--brown)}
  .order-total{font-size:18px;font-weight:700;color:var(--teal)}
  .order-time{font-size:var(--text-xs);color:var(--muted);margin-bottom:var(--space-2)}
  .order-items{font-size:var(--text-xs);color:var(--muted);margin-bottom:10px;line-height:1.8}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
  .pay-btn{background:var(--brand-gradient);color:#fff;border:none;border-radius:10px;padding:10px;font-size:var(--text-sm);font-weight:700;cursor:pointer}
  .split-btn{background:var(--bg);color:var(--teal);border:1.5px solid var(--teal);border-radius:10px;padding:10px;font-size:var(--text-sm);font-weight:700;cursor:pointer}
  .danger-btn{background:#fbe9e9;color:var(--error);border:1.5px solid var(--error);border-radius:10px;padding:10px;font-size:var(--text-sm);font-weight:700;cursor:pointer}
  .refresh-btn{background:rgba(255,255,255,0.2);border:none;border-radius:20px;padding:6px 14px;color:#fff;font-size:var(--text-xs);cursor:pointer;margin-top:var(--space-2)}
  .tab-btn{flex:1;padding:10px;font-size:var(--text-sm);font-weight:700;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent}
  .tab-btn.active{color:var(--teal);border-bottom-color:var(--teal)}

  /* MODALS */
  .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding:20px 20px 40px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
  .modal-title{font-size:18px;font-weight:700;color:var(--brown);margin-bottom:4px}
  .modal-subtitle{font-size:var(--text-sm);color:var(--muted);margin-bottom:var(--space-3)}
  .modal-total{font-size:32px;font-weight:700;color:var(--teal);margin-bottom:var(--space-3)}

  /* PAYMENT FIELDS */
  .pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);margin-bottom:var(--space-3)}
  .pay-method{background:#f5f5f5;border:2px solid transparent;border-radius:var(--radius);padding:12px 8px;text-align:center;cursor:pointer;font-size:var(--text-xs);font-weight:700;color:var(--muted)}
  .pay-method.selected{background:var(--teal-tint);border-color:var(--teal);color:var(--teal)}
  .pay-method-icon{font-size:22px;display:block;margin-bottom:4px}
  .field-group{margin-bottom:12px}
  .field-label{font-size:var(--text-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;display:block;margin-bottom:5px}
  .field-input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:16px;font-family:var(--font-body);outline:none}
  .field-input:focus{border-color:var(--teal)}
  .cambio-display{background:var(--teal-tint);border-radius:10px;padding:12px 14px;text-align:center;margin-bottom:12px}
  .cambio-label{font-size:var(--text-xs);color:var(--muted);margin-bottom:4px}
  .cambio-value{font-size:24px;font-weight:700;color:var(--teal)}
  .cambio-value.negative{color:var(--error)}
  .confirm-btn{width:100%;background:var(--brand-gradient);color:#fff;border:none;border-radius:var(--radius);padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:var(--space-2)}
  .confirm-btn:disabled{background:#ccc}
  .cancel-modal-btn{width:100%;background:none;border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;font-size:var(--text-sm);font-weight:600;color:var(--muted);cursor:pointer}
  .split-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}

  /* SPLIT SCREEN */
  .split-screen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:50;overflow-y:auto;max-width:480px;left:50%;transform:translateX(-50%)}
  .split-screen.open{display:block}
  .split-header{background:var(--brand-gradient);color:#fff;padding:14px var(--space-3);display:flex;justify-content:space-between;align-items:center}
  .split-header h2{font-size:var(--text-md);font-weight:700;color:#fff}
  .back-btn{background:rgba(255,255,255,0.2);border:none;border-radius:10px;padding:6px 12px;color:#fff;font-size:var(--text-xs);cursor:pointer}
  .split-total-bar{background:var(--brown);color:#fff;padding:var(--space-2) var(--space-3);display:flex;justify-content:space-between;align-items:center}
  .split-total-bar span{font-size:var(--text-sm)}
  .split-total-bar strong{font-size:var(--text-md)}

  /* EQUAL SPLIT */
  .equal-split-card{background:var(--surface);border-radius:var(--radius);padding:14px var(--space-3);margin:12px var(--space-3);box-shadow:var(--shadow)}
  .equal-split-title{font-size:var(--text-sm);font-weight:700;color:var(--brown);margin-bottom:10px}
  .equal-split-row{display:flex;align-items:center;gap:10px}
  .persons-input{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;width:80px;text-align:center;font-family:var(--font-body)}
  .apply-equal-btn{flex:1;background:var(--teal);color:#fff;border:none;border-radius:10px;padding:10px;font-size:var(--text-sm);font-weight:700;cursor:pointer}

  /* PERSONS LIST */
  .persons-section{margin:0 var(--space-3) 12px}
  .add-person-btn{width:100%;background:var(--surface);border:2px dashed var(--teal);border-radius:10px;padding:10px;font-size:var(--text-sm);font-weight:700;color:var(--teal);cursor:pointer;margin-bottom:10px}
  .person-card{background:var(--surface);border-radius:var(--radius);margin-bottom:var(--space-2);box-shadow:var(--shadow);overflow:hidden}
  .person-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .person-name{font-size:var(--text-sm);font-weight:700;color:var(--brown)}
  .person-subtotal{font-size:var(--text-sm);font-weight:700;color:var(--teal)}
  .person-status{font-size:var(--text-xs);font-weight:700;padding:3px 8px;border-radius:10px}
  .person-status.pending{background:#fdf0e8;color:var(--warning)}
  .person-status.paid{background:var(--teal-tint);color:var(--teal)}
  .person-items{padding:var(--space-2) 14px}
  .person-item-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f5f5f5}
  .person-item-row:last-child{border-bottom:none}
  .person-item-name{font-size:var(--text-xs);color:var(--muted);flex:1}
  .person-item-price{font-size:var(--text-xs);color:var(--brown);font-weight:600;margin-right:var(--space-2)}
  .unassign-btn{background:#fbe9e9;border:none;border-radius:50%;width:20px;height:20px;color:var(--error);cursor:pointer;font-size:var(--text-xs);flex-shrink:0}
  .person-pay-btn{width:calc(100% - 28px);margin:var(--space-2) 14px;background:var(--brand-gradient);color:#fff;border:none;border-radius:8px;padding:8px;font-size:var(--text-sm);font-weight:700;cursor:pointer}
  .person-pay-btn.paid{background:var(--teal-tint);color:var(--teal);border:1.5px solid var(--teal)}

  /* UNASSIGNED ITEMS */
  .unassigned-section{margin:0 var(--space-3) 80px}
  .unassigned-title{font-size:var(--text-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:var(--space-2)}
  .unassigned-item{background:var(--surface);border-radius:10px;padding:10px 14px;margin-bottom:6px;box-shadow:var(--shadow)}
  .unassigned-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .unassigned-item-name{font-size:var(--text-sm);font-weight:600;color:var(--brown)}
  .unassigned-item-price{font-size:var(--text-sm);font-weight:700;color:var(--teal)}
  .assign-btns{display:flex;flex-wrap:wrap;gap:5px}
  .assign-btn{background:var(--teal-tint);border:none;border-radius:8px;padding:5px 10px;font-size:var(--text-xs);font-weight:700;color:var(--teal);cursor:pointer}

  /* BOTTOM BAR */
  .split-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:2px solid var(--teal);padding:12px var(--space-3)}
  .split-progress{font-size:var(--text-xs);color:var(--muted);text-align:center;margin-bottom:var(--space-2)}
  .close-split-btn{width:100%;background:var(--brand-gradient);color:#fff;border:none;border-radius:var(--radius);padding:13px;font-size:var(--text-md);font-weight:700;cursor:pointer}
  .close-split-btn:disabled{background:#ccc}

  /* TABLET (counter iPad) — use the extra width instead of a narrow column */
  @media (min-width:768px){
    body{max-width:720px}
    #orders-list,#orders-hoy{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start;padding:0 var(--space-3)}
    .order-card{margin:0 0 12px}
    .modal{max-width:520px}
  }
</style>
</head>
<body>
<div class="o-header">
  <button class="btn btn--ghost btn--sm" onclick="location.href='/dashboard.html'" style="margin-bottom:var(--space-2)">← Dashboard</button>
  <h1>🌿 ORAMA CAFÉ</h1>
  <p>Caja</p>
  <button class="refresh-btn" onclick="loadAll()">↻ Actualizar</button>
</div>
<div class="summary">
  <div class="summary-card">
    <div class="summary-value" id="total-ordenes">0</div>
    <div class="summary-label">Ordenes hoy</div>
  </div>
  <div class="summary-card">
    <div class="summary-value" id="total-ventas">$0</div>
    <div class="summary-label">Ventas hoy</div>
  </div>
</div>
<div style="display:flex;background:var(--surface);border-bottom:2px solid var(--line);margin-bottom:8px">
  <button class="tab-btn active" id="tab-activas" onclick="showCashierTab('activas')">Activas</button>
  <button class="tab-btn" id="tab-hoy" onclick="showCashierTab('hoy')">Hoy</button>
</div>
<div id="orders-list"><div class="spinner"></div></div>
<div id="orders-hoy" style="display:none;padding:0 0 100px"></div>

<!-- PAYMENT MODAL -->
<div class="modal-overlay" id="payment-modal">
  <div class="modal">
    <div class="modal-subtitle" id="modal-subtitle">Mesa 1</div>
    <div class="modal-title">Total a cobrar</div>
    <div class="modal-total" id="modal-total">$0.00</div>
    <div class="pay-methods" style="grid-template-columns:repeat(5,1fr)">
      <div class="pay-method selected" onclick="selectMethod('efectivo')"><span class="pay-method-icon">💵</span>Efectivo</div>
      <div class="pay-method" onclick="selectMethod('tarjeta')"><span class="pay-method-icon">💳</span>Tarjeta</div>
      <div class="pay-method" onclick="selectMethod('mixto')"><span class="pay-method-icon">🔀</span>Mixto</div>
      <div class="pay-method" onclick="selectMethod('cortesia')"><span class="pay-method-icon">🎁</span>Cortesía</div>
      <div class="pay-method" onclick="selectMethod('cliente_frecuente')"><span class="pay-method-icon">⭐</span>Frecuente</div>
    </div>
    <div id="payment-fields"></div>
    <button class="confirm-btn" onclick="confirmarPago()">✅ Confirmar cobro</button>
    <button class="cancel-modal-btn" onclick="closePaymentModal()">Cancelar</button>
  </div>
</div>

<!-- FACTURA MODAL -->
<div class="modal-overlay" id="factura-modal">
  <div class="modal">
    <div id="factura-modal-content"></div>
  </div>
</div>

<!-- SPLIT SCREEN -->
<div class="split-screen" id="split-screen">
  <div class="split-header">
    <h2>✂️ Dividir cuenta</h2>
    <button class="back-btn" onclick="closeSplit()">← Regresar</button>
  </div>
  <div class="split-total-bar">
    <span>Total orden</span>
    <strong id="split-total-display">$0.00</strong>
  </div>

  <!-- Equal split shortcut -->
  <div class="equal-split-card">
    <div class="equal-split-title">⚡ División igualitaria</div>
    <div class="equal-split-row">
      <input type="number" class="persons-input" id="equal-persons" placeholder="2" min="2" max="20">
      <button class="apply-equal-btn" onclick="applyEqualSplit()">Dividir en partes iguales</button>
    </div>
  </div>

  <!-- Persons -->
  <div class="persons-section">
    <button class="add-person-btn" onclick="addPerson()">+ Agregar persona</button>
    <div id="persons-list"></div>
  </div>

  <!-- Unassigned items -->
  <div class="unassigned-section">
    <div class="unassigned-title">Artículos sin asignar</div>
    <div id="unassigned-list"></div>
  </div>

  <div class="split-bottom">
    <div class="split-progress" id="split-progress">0 de 0 pagado</div>
    <button class="close-split-btn" id="close-all-btn" onclick="closeSplitOrder()" disabled>Cerrar orden completa</button>
  </div>
</div>

<script src="/js/orama.js"></script>
<script>
// State
let currentOrdenId=null, currentTotal=0, currentMethod='efectivo';
let splitOrdenId=null, splitTotal=0, splitItems=[], persons=[], personCounter=0;

// Colors for persons
const personColors=['#1aab85','#E8A45A','#7C6FAB','#D46B6B','#5BA08A','#2d1a0e'];

// ─── MAIN LIST ───
async function loadAll(){
  await Promise.all([loadOrders(), loadSummary()]);
}

async function loadOrders(){
  try{
    const res=await fetch("/api/ordenes");
    const orders=await res.json();
    const list=document.getElementById("orders-list");
    if(!orders.length){list.innerHTML="<div class='empty'><span class='empty__icon'>✅</span>No hay ordenes activas</div>";return;}
    let html="";
    for(const o of orders){
      const itemsRes=await fetch("/api/ordenes/"+o.id+"/items");
      const items=await itemsRes.json();
      html+="<div class='order-card'>";
      html+="<div class='order-header'><span class='order-mesa'>"+o.mesa_nombre+"</span><span class='order-total'>$"+parseFloat(o.total).toFixed(2)+"</span></div>";
      html+="<div class='order-time'>"+new Date(o.created_at).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})+"</div>";
      html+="<div class='order-items'>"+items.map(i=>"x"+i.cantidad+" "+i.item_nombre).join("<br>")+"</div>";
      html+="<div class='btn-row' style='grid-template-columns:1fr 1fr 1fr'>";
      html+="<button class='pay-btn' onclick='openPayment("+o.id+",\""+o.mesa_nombre+"\","+parseFloat(o.total)+")'>💳 Cobrar</button>";
      html+="<button class='split-btn' onclick='openSplit("+o.id+",\""+o.mesa_nombre+"\","+parseFloat(o.total)+")'>✂️ Dividir</button>";
      html+="<button class='danger-btn' onclick='cancelarOrden("+o.id+")'>❌ Cancelar</button>";
      html+="</div></div>";
    }
    list.innerHTML=html;
  }catch(e){document.getElementById("orders-list").innerHTML="<div class='empty'><span class='empty__icon'>⚠️</span>Error al cargar</div>";}
}

async function loadSummary(){
  try{
    const res=await fetch("/api/resumen");
    const data=await res.json();
    document.getElementById("total-ordenes").textContent=data.ordenes||0;
    document.getElementById("total-ventas").textContent="$"+parseFloat(data.total||0).toFixed(2);
  }catch(e){}
}

// ─── PAYMENT MODAL ───
function openPayment(id,mesa,total,subtitle){
  console.log('openPayment called with id:', id);
  currentOrdenId=id; currentTotal=total; currentMethod='efectivo';
  document.getElementById("modal-subtitle").textContent=subtitle||mesa;
  document.getElementById("modal-total").textContent="$"+total.toFixed(2);
  document.getElementById("payment-modal").classList.add("open");
  document.querySelectorAll(".pay-method").forEach((m,i)=>m.classList.toggle("selected",i===0));
  renderPaymentFields();
}

function closePaymentModal(){
  document.getElementById("payment-modal").classList.remove("open");
  currentOrdenId=null;
}

function selectMethod(method){
  currentMethod=method;
  const methods=['efectivo','tarjeta','mixto','cortesia','cliente_frecuente'];
  document.querySelectorAll(".pay-method").forEach((m,i)=>m.classList.toggle("selected",methods[i]===method));
  renderPaymentFields();
}

function renderPaymentFields(){
  const fields=document.getElementById("payment-fields");
  if(currentMethod==='efectivo'){
    fields.innerHTML='<div class="field-group"><label class="field-label">Cantidad recibida</label><input type="number" class="field-input" id="efectivo-input" placeholder="$0.00" oninput="calcCambio()" step="0.01"></div><div class="cambio-display"><div class="cambio-label">Cambio a entregar</div><div class="cambio-value" id="cambio-value">$0.00</div></div>';
  } else if(currentMethod==='tarjeta'){
    fields.innerHTML='<div style="background:var(--teal-tint);border-radius:10px;padding:14px;text-align:center;margin-bottom:12px"><span style="font-size:13px;color:var(--teal);font-weight:600">Cobrar $'+currentTotal.toFixed(2)+' con tarjeta</span></div>';
  } else if(currentMethod==='mixto'){
    fields.innerHTML='<div class="split-row"><div class="field-group"><label class="field-label">Efectivo</label><input type="number" class="field-input" id="mixto-efectivo" placeholder="$0.00" oninput="calcMixto()" step="0.01"></div><div class="field-group"><label class="field-label">Tarjeta</label><input type="number" class="field-input" id="mixto-tarjeta" placeholder="$0.00" oninput="calcMixto()" step="0.01"></div></div><div class="cambio-display"><div class="cambio-label">Restante / Cambio</div><div class="cambio-value" id="mixto-restante">$0.00</div></div>';
  } else if(currentMethod==='cortesia'){
    fields.innerHTML='<div class="field-group"><label class="field-label">Motivo (opcional)</label><input type="text" class="field-input" id="cortesia-nota" placeholder="Ej. Error en orden, cliente especial..."></div><div style="background:var(--teal-tint);border-radius:10px;padding:14px;text-align:center;margin-bottom:12px"><span style="font-size:13px;color:var(--teal);font-weight:600">Orden sin cargo - Cortesía</span></div>';
  } else if(currentMethod==='cliente_frecuente'){
    fields.innerHTML='<div class="field-group"><label class="field-label">Producto cortesía</label><input type="text" class="field-input" id="frecuente-producto" placeholder="Ej. Espresso, Café Americano..."></div><div style="background:#fff8e8;border-radius:10px;padding:14px;text-align:center;margin-bottom:12px"><span style="font-size:13px;color:var(--warning);font-weight:600">Tarjeta cliente frecuente - Sin cargo</span></div>';
  } else {
    fields.innerHTML='';
  }
}

function calcCambio(){
  const r=parseFloat(document.getElementById("efectivo-input").value)||0;
  const c=r-currentTotal;
  const el=document.getElementById("cambio-value");
  el.textContent="$"+Math.abs(c).toFixed(2)+(c<0?" (faltan)":"");
  el.className="cambio-value"+(c<0?" negative":"");
}

function calcMixto(){
  const ef=parseFloat(document.getElementById("mixto-efectivo").value)||0;
  const ta=parseFloat(document.getElementById("mixto-tarjeta").value)||0;
  const r=currentTotal-ef-ta;
  const el=document.getElementById("mixto-restante");
  el.textContent="$"+Math.abs(r).toFixed(2)+(r>0?" pendiente":r<0?" cambio":" ✅ exacto");
  el.className="cambio-value"+(r>0?" negative":"");
}

async function confirmarPago(){
  if(currentMethod==='efectivo'){
    const r=parseFloat(document.getElementById("efectivo-input").value)||0;
    if(r<currentTotal){Orama.toast.warning("La cantidad recibida es menor al total");return;}
  }
  if(currentMethod==='mixto'){
    const ef=parseFloat(document.getElementById("mixto-efectivo").value)||0;
    const ta=parseFloat(document.getElementById("mixto-tarjeta").value)||0;
    if(ef+ta<currentTotal){Orama.toast.warning("La suma no cubre el total");return;}
  }
  if(currentOrdenId){
    let amount_cash=0, amount_card=0;
    if(currentMethod==='efectivo') amount_cash=currentTotal;
    else if(currentMethod==='tarjeta') amount_card=currentTotal;
    else if(currentMethod==='mixto'){
      amount_cash=parseFloat(document.getElementById('mixto-efectivo')?.value)||0;
      amount_card=parseFloat(document.getElementById('mixto-tarjeta')?.value)||0;
    }
    await fetch("/api/ordenes/"+currentOrdenId+"/cerrar",{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        payment_method:currentMethod,
        amount_cash,
        amount_card,
        notas: currentMethod==='cortesia' ? (document.getElementById('cortesia-nota')?.value||'') :
               currentMethod==='cliente_frecuente' ? (document.getElementById('frecuente-producto')?.value||'') : ''
      })
    });
  }
  // Capture values before closePaymentModal clears them
  const receiptId = currentOrdenId;
  const receiptTotal = currentTotal;
  const receiptMethod = currentMethod;
  closePaymentModal();
  loadAll();
  // Mark person as paid if in split mode
  if(window._splitPersonCallback) window._splitPersonCallback();
  // Show receipt
  if(receiptId) showReceipt(receiptId, receiptTotal, receiptMethod);
  // Offer to invoice (CFDI)
  if(receiptId) offerFacturar(receiptId, receiptTotal, receiptMethod);
}

      + '<td style="padding:3px 0;font-size:13px;text-align:right">$' + parseFloat(i.precio * i.cantidad).toFixed(2) + '</td>'
      + '</tr>';
  }).join('');

  const extraHtml = method === 'efectivo' && efectivoRec > 0 ?
    '<tr><td style="font-size:12px;color:#666">Recibido</td><td style="font-size:12px;color:#666;text-align:right">$' + efectivoRec.toFixed(2) + '</td></tr>'
    + '<tr><td style="font-size:12px;color:#666">Cambio</td><td style="font-size:12px;color:#666;text-align:right">$' + cambio.toFixed(2) + '</td></tr>'
    : method === 'mixto' ?
    '<tr><td style="font-size:12px;color:#666">Efectivo</td><td style="font-size:12px;color:#666;text-align:right">$' + mixtoEfectivo.toFixed(2) + '</td></tr>'
    + '<tr><td style="font-size:12px;color:#666">Tarjeta</td><td style="font-size:12px;color:#666;text-align:right">$' + mixtoTarjeta.toFixed(2) + '</td></tr>'
    : '';

  const receiptHtml = '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">'
    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
    + '<title>Recibo — Orama Café</title>'
    + '<style>'
    + '*{box-sizing:border-box;margin:0;padding:0}'
    + 'body{font-family:"Courier New",monospace;background:white;display:flex;justify-content:center;padding:20px}'
    + '.receipt{width:300px;padding:20px 16px}'
    + '.logo{text-align:center;font-size:22px;font-weight:700;letter-spacing:3px;font-family:Georgia,serif;color:#0d6b54;margin-bottom:4px}'
    + '.address{text-align:center;font-size:11px;color:#666;line-height:1.6;margin-bottom:12px}'
    + '.divider{border-top:1px dashed #ccc;margin:10px 0}'
    + '.meta{display:flex;justify-content:space-between;font-size:11px;color:#666;margin-bottom:8px}'
    + 'table{width:100%;border-collapse:collapse}'
    + '.total-row td{font-size:15px;font-weight:700;color:#0d6b54;padding-top:8px}'
    + '.method{font-size:12px;color:#666;margin-top:6px}'
    + '.thanks{text-align:center;margin-top:16px;font-size:13px;color:#0d6b54;font-style:italic}'
    + '.btn-row{display:flex;gap:10px;margin-top:20px;justify-content:center}'
    + '.btn{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}'
    + '.btn-print{background:#0d6b54;color:white}'
    + '.btn-close{background:#eee;color:#333}'
    + '@media print{.btn-row{display:none}body{padding:0}}'
    + '</style></head><body>'
    + '<div class="receipt">'
    + '<div class="logo">🌿 ORAMA CAFÉ</div>'
    + '<div class="address">Venustiano Carranza 108-a<br>Aguascalientes, Ags. C.P. 20000<br>México</div>'
    + '<div class="divider"></div>'
    + '<div class="meta"><span>' + fecha + ' ' + hora + '</span><span>Orden #' + ordenId + '</span></div>'
    + '<div class="divider"></div>'
    + '<table>' + itemsHtml + '</table>'
    + '<div class="divider"></div>'
    + '<table>'

    + '</table>'
    + '<div class="method">Método: ' + methodLabel + '</div>'
    + '<div class="divider"></div>'

// ─── SPLIT SCREEN ───
async function openSplit(id,mesa,total){
  splitOrdenId=id; splitTotal=total; persons=[]; personCounter=0;
  document.getElementById("split-total-display").textContent="$"+total.toFixed(2);
  document.getElementById("split-screen").classList.add("open");
  // Load items
  const res=await fetch("/api/ordenes/"+id+"/items");
  const rawItems=await res.json();
  // Expand by quantity
  splitItems=[];
  rawItems.forEach(item=>{
    for(let i=0;i<item.cantidad;i++){
      splitItems.push({
        id: item.id+"_"+i,
        nombre: item.item_nombre,
        precio: parseFloat(item.precio),
        assignedTo: null
      });
    }
  });
  renderSplit();
}

function closeSplit(){
  document.getElementById("split-screen").classList.remove("open");
  splitOrdenId=null; splitItems=[]; persons=[];
}

function addPerson(){
  personCounter++;
  persons.push({id:personCounter, name:"Persona "+personCounter, paid:false, color:personColors[(personCounter-1)%personColors.length]});
  renderSplit();
}

function applyEqualSplit(){
  const n=parseInt(document.getElementById("equal-persons").value)||2;
  if(n<2){Orama.toast.warning("Mínimo 2 personas");return;}
  // Remove existing persons
  persons=[];personCounter=0;
  for(let i=0;i<n;i++){
    personCounter++;
    persons.push({id:personCounter,name:"Persona "+personCounter,paid:false,color:personColors[i%personColors.length]});
  }
  // Distribute items as evenly as possible
  splitItems.forEach((item,idx)=>{
    item.assignedTo=persons[idx%n].id;
  });
  renderSplit();
}

function assignItem(itemId,personId){
  const item=splitItems.find(i=>i.id===itemId);
  if(item) item.assignedTo=personId;
  renderSplit();
}

function unassignItem(itemId){
  const item=splitItems.find(i=>i.id===itemId);
  if(item) item.assignedTo=null;
  renderSplit();
}

function getPersonSubtotal(personId){
  return splitItems.filter(i=>i.assignedTo===personId).reduce((s,i)=>s+i.precio,0);
}

function renderSplit(){
  // Persons list
  const paidCount=persons.filter(p=>p.paid).length;
  const allPaid=persons.length>0 && persons.every(p=>p.paid);
  const unassignedCount=splitItems.filter(i=>!i.assignedTo).length;

  let personsHtml="";
  persons.forEach(p=>{
    const items=splitItems.filter(i=>i.assignedTo===p.id);
    const subtotal=items.reduce((s,i)=>s+i.precio,0);
    personsHtml+='<div class="person-card">';
    personsHtml+='<div class="person-header"><span class="person-name" style="color:'+p.color+'">● '+p.name+'</span>';
    personsHtml+='<span class="person-subtotal">$'+subtotal.toFixed(2)+'</span>';
    personsHtml+='<span class="person-status '+(p.paid?'paid':'pending')+'">'+(p.paid?'✅ Pagado':'Pendiente')+'</span></div>';
    if(items.length){
      personsHtml+='<div class="person-items">';
      items.forEach(item=>{
        personsHtml+='<div class="person-item-row"><span class="person-item-name">'+item.nombre+'</span><span class="person-item-price">$'+item.precio.toFixed(2)+'</span>';
        if(!p.paid) personsHtml+='<button class="unassign-btn" onclick="unassignItem(\''+item.id+'\')">×</button>';
        personsHtml+='</div>';
      });
      personsHtml+='</div>';
    }
    if(!p.paid && subtotal>0){
      personsHtml+='<button class="person-pay-btn" onclick="payPerson('+p.id+','+subtotal+')">💳 Cobrar $'+subtotal.toFixed(2)+'</button>';
    } else if(p.paid){
      personsHtml+='<button class="person-pay-btn paid" disabled>✅ Pagado</button>';
    }
    personsHtml+='</div>';
  });
  document.getElementById("persons-list").innerHTML=personsHtml;

  // Unassigned items
  const unassigned=splitItems.filter(i=>!i.assignedTo);
  if(unassigned.length && persons.length){
    document.getElementById("unassigned-list").innerHTML=unassigned.map(item=>{
      const btns=persons.map(p=>'<button class="assign-btn" style="background:'+p.color+'20;color:'+p.color+'" onclick="assignItem(\''+item.id+'\','+p.id+')">'+p.name+'</button>').join("");
      return '<div class="unassigned-item"><div class="unassigned-item-header"><span class="unassigned-item-name">'+item.nombre+'</span><span class="unassigned-item-price">$'+item.precio.toFixed(2)+'</span></div><div class="assign-btns">'+btns+'</div></div>';
    }).join("");
  } else if(!persons.length){
    document.getElementById("unassigned-list").innerHTML='<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">Agrega personas para asignar artículos</div>';
  } else {
    document.getElementById("unassigned-list").innerHTML='<div style="text-align:center;padding:12px;color:var(--teal);font-size:13px;font-weight:600">✅ Todos los artículos asignados</div>';
  }

  // Progress
  document.getElementById("split-progress").textContent=paidCount+" de "+persons.length+" pagado"+(persons.length!==1?"s":"");
  document.getElementById("close-all-btn").disabled=!allPaid||unassignedCount>0;
}

function payPerson(personId,subtotal){
  window._splitPersonCallback=()=>{
    const person=persons.find(p=>p.id===personId);
    if(person) person.paid=true;
    window._splitPersonCallback=null;
    renderSplit();
    // Check if all paid
    if(persons.every(p=>p.paid)){
      document.getElementById("close-all-btn").disabled=false;
    }
  };
  // Open payment modal for this person's amount
  const person=persons.find(p=>p.id===personId);
  openPayment(null, person.name, subtotal, person.name+" — $"+subtotal.toFixed(2));
}

  list.innerHTML='<div style="text-align:center;padding:20px"><div class="spinner"></div></div>';

    const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});

      '<div class="order-header"><span class="order-mesa">'+o.mesa_nombre+'</span><span class="order-total">$'+parseFloat(o.total).toFixed(2)+'</span></div>'+
      '<div class="order-time">'+new Date(o.created_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})+' · '+(o.payment_method==='efectivo'?'Efectivo':o.payment_method==='tarjeta'?'Tarjeta':o.payment_method==='mixto'?'Mixto':o.payment_method==='cortesia'?'Cortesia':'Frecuente')+'</div>'+
      (o.notas?'<div style="font-size:11px;color:var(--muted);font-style:italic;margin-top:4px">'+o.notas+'</div>':'')+
      '</div>'
    ).join('');
  }catch(e){list.innerHTML='<div class="empty"><span class="empty__icon">⚠️</span>Error al cargar</div>';}
}

// ─── FACTURACION CFDI ───
let facturaOrdenId=null, facturaTotal=0, facturaMethod='';

const REGIMENES_FISCALES=[
  ['601','General de Ley Personas Morales'],
  ['603','Personas Morales con Fines no Lucrativos'],
  ['605','Sueldos y Salarios'],
  ['606','Arrendamiento'],
  ['608','Demás ingresos'],
  ['612','Personas Físicas con Actividades Empresariales'],
  ['616','Sin obligaciones fiscales'],
  ['621','Incorporación Fiscal'],
  ['626','RESICO']
];
const USOS_CFDI=[
  ['G01','Adquisición de mercancías'],
  ['G03','Gastos en general'],
  ['P01','Por definir'],
  ['S01','Sin efectos fiscales']
];

function offerFacturar(ordenId,total,method){
  if(total<=0 || method==='cortesia' || method==='cliente_frecuente') return;
  facturaOrdenId=ordenId; facturaTotal=total; facturaMethod=method;
  renderFacturaPrompt();
  document.getElementById('factura-modal').classList.add('open');
}

function closeFacturaModal(){
  document.getElementById('factura-modal').classList.remove('open');
}

function renderFacturaPrompt(){
  document.getElementById('factura-modal-content').innerHTML=
    '<div class="modal-title">🧾 ¿Facturar esta venta?</div>'
    +'<div class="modal-subtitle">Total: $'+facturaTotal.toFixed(2)+'</div>'
    +'<button class="confirm-btn" onclick="renderFacturaForm()">Facturar</button>'
    +'<button class="cancel-modal-btn" onclick="closeFacturaModal()">Omitir</button>';
}

function renderFacturaForm(){
  const regimenOpts=REGIMENES_FISCALES.map(r=>'<option value="'+r[0]+'">'+r[0]+' - '+r[1]+'</option>').join('');
  const usoOpts=USOS_CFDI.map(u=>'<option value="'+u[0]+'">'+u[0]+' - '+u[1]+'</option>').join('');
  const tarjetaHtml=facturaMethod==='tarjeta' ?
    '<div class="field-group"><label class="field-label">¿Débito o Crédito?</label>'
    +'<div class="pay-methods" style="grid-template-columns:1fr 1fr">'
    +'<div class="pay-method selected" id="fp-debito" onclick="selectFormaPagoTarjeta(\'28\')">💳 Débito</div>'
    +'<div class="pay-method" id="fp-credito" onclick="selectFormaPagoTarjeta(\'04\')">💳 Crédito</div>'
    +'</div></div>' : '';

  document.getElementById('factura-modal-content').innerHTML=
    '<div class="modal-title">🧾 Datos de facturación</div>'
    +'<div class="modal-subtitle">Total: $'+facturaTotal.toFixed(2)+'</div>'
    +'<button class="split-btn" style="width:100%;margin-bottom:12px" onclick="submitFacturaGlobal()">⚡ Factura Global (sin datos)</button>'
    +'<div class="field-group"><label class="field-label">RFC</label><input class="field-input" id="factura-rfc" maxlength="13" style="text-transform:uppercase" placeholder="XAXX010101000"></div>'
    +'<div class="field-group"><label class="field-label">Razón Social / Nombre</label><input class="field-input" id="factura-razon" placeholder="Nombre completo o razón social"></div>'
    +'<div class="field-group"><label class="field-label">Régimen Fiscal</label><select class="field-input" id="factura-regimen"><option value="">Selecciona...</option>'+regimenOpts+'</select></div>'
    +'<div class="field-group"><label class="field-label">Código Postal</label><input class="field-input" id="factura-cp" maxlength="5" inputmode="numeric" placeholder="20000"></div>'
    +'<div class="field-group"><label class="field-label">Uso del CFDI</label><select class="field-input" id="factura-uso"><option value="">Selecciona...</option>'+usoOpts+'</select></div>'
    +tarjetaHtml
    +'<div class="field-group"><label class="field-label">Correo (opcional)</label><input class="field-input" id="factura-email" type="email" placeholder="cliente@correo.com"></div>'
    +'<div id="factura-error" style="color:var(--error);font-size:12px;margin-bottom:8px"></div>'
    +'<button class="confirm-btn" onclick="submitFactura()">✅ Timbrar factura</button>'
    +'<button class="cancel-modal-btn" onclick="closeFacturaModal()">Cancelar</button>';

  if(facturaMethod==='tarjeta') window._formaPagoTarjeta='28';
}

function selectFormaPagoTarjeta(v){
  window._formaPagoTarjeta=v;
  document.getElementById('fp-debito').classList.toggle('selected',v==='28');
  document.getElementById('fp-credito').classList.toggle('selected',v==='04');
}

async function submitFacturaGlobal(){
  await doFacturar({tipo:'global'});
}

async function submitFactura(){
  const rfc=document.getElementById('factura-rfc').value.trim().toUpperCase();
  const razon_social=document.getElementById('factura-razon').value.trim();
  const regimen_fiscal=document.getElementById('factura-regimen').value;
  const cp=document.getElementById('factura-cp').value.trim();
  const uso_cfdi=document.getElementById('factura-uso').value;
  const email=document.getElementById('factura-email').value.trim();
  const errEl=document.getElementById('factura-error');

  if(!rfc || !razon_social || !regimen_fiscal || !cp || !uso_cfdi){
    errEl.textContent='Completa todos los campos requeridos';
    return;
  }
  if(!/^\d{5}$/.test(cp)){
    errEl.textContent='El código postal debe tener 5 dígitos';
    return;
  }
  if(!/^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(rfc)){
    errEl.textContent='RFC inválido';
    return;
  }
  errEl.textContent='';
  await doFacturar({tipo:'normal',rfc,razon_social,regimen_fiscal,cp,uso_cfdi,email});
}

async function doFacturar(data){
  if(facturaMethod==='tarjeta') data.forma_pago_tarjeta=window._formaPagoTarjeta||'28';
  data.orden_id=facturaOrdenId;

  const content=document.getElementById('factura-modal-content');
  content.insertAdjacentHTML('beforeend','<div id="factura-spinner" style="text-align:center;padding:10px"><div class="spinner"></div></div>');

  try{
    const res=await fetch('/api/factura',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
    const result=await res.json();
    if(!result.success){
      renderFacturaForm();
      const errEl=document.getElementById('factura-error');
      if(errEl) errEl.textContent=result.message||'Error al timbrar';
      return;
    }
    renderFacturaSuccess(result);
  }catch(e){
    renderFacturaForm();
    const errEl=document.getElementById('factura-error');
    if(errEl) errEl.textContent='Error de conexión al facturar';
  }
}

function renderFacturaSuccess(result){
  window._lastFactura=result;
  document.getElementById('factura-modal-content').innerHTML=
    '<div class="modal-title">✅ Factura timbrada</div>'
    +'<div style="background:var(--teal-tint);border-radius:10px;padding:14px;text-align:center;margin-bottom:16px">'
    +'<div style="font-size:11px;color:var(--muted);margin-bottom:4px">FOLIO FISCAL (UUID)</div>'
    +'<div style="font-size:13px;font-weight:700;color:var(--teal);word-break:break-all">'+result.folio_fiscal+'</div>'
    +'</div>'
    +'<div class="split-row" style="margin-bottom:8px">'
    +'<button class="pay-btn" onclick="reenviarCorreo()">📧 Correo</button>'
    +'<button class="pay-btn" onclick="reenviarWhatsapp()">📱 WhatsApp</button>'
    +'</div>'
    +'<a href="'+result.pdf_url+'" target="_blank" style="display:block;text-align:center;font-size:13px;color:var(--teal);margin-bottom:12px">Ver PDF</a>'
    +'<button class="cancel-modal-btn" onclick="closeFacturaModal()">Cerrar</button>';
}

async function reenviarCorreo(){
  const email=await Orama.prompt('Correo para reenviar la factura:', {type:'email', placeholder:'cliente@correo.com'});
  if(!email) return;
  try{
    const res=await fetch('/api/factura/'+window._lastFactura.facturapi_id+'/email',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email})
    });
    const r=await res.json();
    if(r.success) Orama.toast.success('Correo enviado');
    else Orama.toast.error(r.message||'Error al enviar correo');
  }catch(e){Orama.toast.error('Error al enviar correo');}
}

function reenviarWhatsapp(){
  const pdfFullUrl=window.location.origin+window._lastFactura.pdf_url;
  const msg=encodeURIComponent('Aquí tienes tu factura de Orama Café: '+pdfFullUrl);
  window.open('https://wa.me/?text='+msg,'_blank');
}

loadAll();
setInterval(loadAll,30000);
