<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orama Café - Caja</title>
<style>
  :root{--teal:#1aab85;--dark:#0d6b54;--brown:#2d1a0e;--light:#e8f8f4;--gray:#666;--border:#ddd;--amber:#E8A45A;--red:#D46B6B}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f0f7f4;max-width:480px;margin:0 auto}
  .header{background:linear-gradient(135deg,#0d6b54,#1aab85);color:white;padding:20px;text-align:center}
  .header h1{font-size:22px;font-family:Georgia,serif;letter-spacing:2px}
  .header p{font-size:12px;opacity:0.8;margin-top:4px}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
  .summary-card{background:white;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
  .summary-value{font-size:24px;font-weight:700;color:var(--teal)}
  .summary-label{font-size:11px;color:var(--gray);margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}
  .section-title{font-size:13px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.5px;padding:8px 16px}
  .order-card{background:white;border-radius:12px;padding:14px 16px;margin:0 16px 10px;box-shadow:0 1px 4px rgba(0,0,0,0.08);border-left:4px solid var(--teal)}
  .order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .order-mesa{font-size:15px;font-weight:700;color:var(--brown)}
  .order-total{font-size:18px;font-weight:700;color:var(--teal)}
  .order-time{font-size:11px;color:var(--gray);margin-bottom:8px}
  .order-items{font-size:12px;color:var(--gray);margin-bottom:10px;line-height:1.8}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pay-btn{background:linear-gradient(135deg,#0d6b54,#1aab85);color:white;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer}
  .split-btn{background:#f0f7f4;color:var(--teal);border:1.5px solid var(--teal);border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer}
  .empty{text-align:center;padding:40px;color:var(--gray)}
  .refresh-btn{background:rgba(255,255,255,0.2);border:none;border-radius:20px;padding:6px 14px;color:white;font-size:12px;cursor:pointer;margin-top:8px}
  .spinner{width:24px;height:24px;border:2px solid rgba(26,171,133,0.3);border-top-color:var(--teal);border-radius:50%;animation:spin 0.75s linear infinite;margin:20px auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* MODALS */
  .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:white;border-radius:20px 20px 0 0;padding:20px 20px 40px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
  .modal-title{font-size:18px;font-weight:700;color:var(--brown);margin-bottom:4px}
  .modal-subtitle{font-size:13px;color:var(--gray);margin-bottom:16px}
  .modal-total{font-size:32px;font-weight:700;color:var(--teal);margin-bottom:16px}

  /* PAYMENT FIELDS */
  .pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .pay-method{background:#f5f5f5;border:2px solid transparent;border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:var(--gray)}
  .pay-method.selected{background:var(--light);border-color:var(--teal);color:var(--teal)}
  .pay-method-icon{font-size:22px;display:block;margin-bottom:4px}
  .field-group{margin-bottom:12px}
  .field-label{font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.4px;display:block;margin-bottom:5px}
  .field-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:16px;font-family:Arial,sans-serif;outline:none}
  .field-input:focus{border-color:var(--teal)}
  .cambio-display{background:var(--light);border-radius:10px;padding:12px 14px;text-align:center;margin-bottom:12px}
  .cambio-label{font-size:12px;color:var(--gray);margin-bottom:4px}
  .cambio-value{font-size:24px;font-weight:700;color:var(--teal)}
  .cambio-value.negative{color:var(--red)}
  .confirm-btn{width:100%;background:linear-gradient(135deg,#0d6b54,#1aab85);color:white;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:8px}
  .confirm-btn:disabled{background:#ccc}
  .cancel-modal-btn{width:100%;background:none;border:1.5px solid var(--border);border-radius:12px;padding:12px;font-size:14px;font-weight:600;color:var(--gray);cursor:pointer}
  .split-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  /* SPLIT SCREEN */
  .split-screen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f7f4;z-index:50;overflow-y:auto;max-width:480px;left:50%;transform:translateX(-50%)}
  .split-screen.open{display:block}
  .split-header{background:linear-gradient(135deg,#0d6b54,#1aab85);color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .split-header h2{font-size:16px;font-weight:700}
  .back-btn{background:rgba(255,255,255,0.2);border:none;border-radius:10px;padding:6px 12px;color:white;font-size:12px;cursor:pointer}
  .split-total-bar{background:var(--brown);color:white;padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
  .split-total-bar span{font-size:13px}
  .split-total-bar strong{font-size:16px}

  /* EQUAL SPLIT */
  .equal-split-card{background:white;border-radius:12px;padding:14px 16px;margin:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
  .equal-split-title{font-size:13px;font-weight:700;color:var(--brown);margin-bottom:10px}
  .equal-split-row{display:flex;align-items:center;gap:10px}
  .persons-input{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:16px;width:80px;text-align:center;font-family:Arial,sans-serif}
  .apply-equal-btn{flex:1;background:var(--teal);color:white;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer}

  /* PERSONS LIST */
  .persons-section{margin:0 16px 12px}
  .add-person-btn{width:100%;background:white;border:2px dashed var(--teal);border-radius:10px;padding:10px;font-size:13px;font-weight:700;color:var(--teal);cursor:pointer;margin-bottom:10px}
  .person-card{background:white;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,0.08);overflow:hidden}
  .person-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
  .person-name{font-size:14px;font-weight:700;color:var(--brown)}
  .person-subtotal{font-size:14px;font-weight:700;color:var(--teal)}
  .person-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px}
  .person-status.pending{background:#fdf0e8;color:var(--amber)}
  .person-status.paid{background:#e8f8f4;color:var(--teal)}
  .person-items{padding:8px 14px}
  .person-item-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f5f5f5}
  .person-item-row:last-child{border-bottom:none}
  .person-item-name{font-size:12px;color:var(--gray);flex:1}
  .person-item-price{font-size:12px;color:var(--brown);font-weight:600;margin-right:8px}
  .unassign-btn{background:#fbe9e9;border:none;border-radius:50%;width:20px;height:20px;color:var(--red);cursor:pointer;font-size:12px;flex-shrink:0}
  .person-pay-btn{width:calc(100% - 28px);margin:8px 14px;background:linear-gradient(135deg,#0d6b54,#1aab85);color:white;border:none;border-radius:8px;padding:8px;font-size:13px;font-weight:700;cursor:pointer}
  .person-pay-btn.paid{background:#e8f8f4;color:var(--teal);border:1.5px solid var(--teal)}

  /* UNASSIGNED ITEMS */
  .unassigned-section{margin:0 16px 80px}
  .unassigned-title{font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px}
  .unassigned-item{background:white;border-radius:10px;padding:10px 14px;margin-bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
  .unassigned-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .unassigned-item-name{font-size:13px;font-weight:600;color:var(--brown)}
  .unassigned-item-price{font-size:13px;font-weight:700;color:var(--teal)}
  .assign-btns{display:flex;flex-wrap:wrap;gap:5px}
  .assign-btn{background:var(--light);border:none;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--teal);cursor:pointer}

  /* BOTTOM BAR */
  .split-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:white;border-top:2px solid var(--teal);padding:12px 16px}
  .split-progress{font-size:12px;color:var(--gray);text-align:center;margin-bottom:8px}
  .close-split-btn{width:100%;background:linear-gradient(135deg,#0d6b54,#1aab85);color:white;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  .close-split-btn:disabled{background:#ccc}
</style>
</head>
<body>
<div class="header">
  <h1>🌿 ORAMA CAFÉ</h1>
  <p>Caja</p>
  <button class="refresh-btn" onclick="loadAll()">↻ Actualizar</button>
</div>
<div class="summary">
  <div class="summary-card">
    <div class="summary-value" id="total-ordenes">0</div>
    <div class="summary-label">Ordenes hoy</div>
  </div>
  <div class="summary-card">
    <div class="summary-value" id="total-ventas">$0</div>
    <div class="summary-label">Ventas hoy</div>
  </div>
</div>
<div class="section-title">Ordenes activas</div>
<div id="orders-list"><div class="spinner"></div></div>

<!-- PAYMENT MODAL -->
<div class="modal-overlay" id="payment-modal">
  <div class="modal">
    <div class="modal-subtitle" id="modal-subtitle">Mesa 1</div>
    <div class="modal-title">Total a cobrar</div>
    <div class="modal-total" id="modal-total">$0.00</div>
    <div class="pay-methods">
      <div class="pay-method selected" onclick="selectMethod('efectivo')"><span class="pay-method-icon">💵</span>Efectivo</div>
      <div class="pay-method" onclick="selectMethod('tarjeta')"><span class="pay-method-icon">💳</span>Tarjeta</div>
      <div class="pay-method" onclick="selectMethod('mixto')"><span class="pay-method-icon">🔀</span>Mixto</div>
    </div>
    <div id="payment-fields"></div>
    <button class="confirm-btn" onclick="confirmarPago()">✅ Confirmar cobro</button>
    <button class="cancel-modal-btn" onclick="closePaymentModal()">Cancelar</button>
  </div>
</div>

<!-- SPLIT SCREEN -->
<div class="split-screen" id="split-screen">
  <div class="split-header">
    <h2>✂️ Dividir cuenta</h2>
    <button class="back-btn" onclick="closeSplit()">← Regresar</button>
  </div>
  <div class="split-total-bar">
    <span>Total orden</span>
    <strong id="split-total-display">$0.00</strong>
  </div>

  <!-- Equal split shortcut -->
  <div class="equal-split-card">
    <div class="equal-split-title">⚡ División igualitaria</div>
    <div class="equal-split-row">
      <input type="number" class="persons-input" id="equal-persons" placeholder="2" min="2" max="20">
      <button class="apply-equal-btn" onclick="applyEqualSplit()">Dividir en partes iguales</button>
    </div>
  </div>

  <!-- Persons -->
  <div class="persons-section">
    <button class="add-person-btn" onclick="addPerson()">+ Agregar persona</button>
    <div id="persons-list"></div>
  </div>

  <!-- Unassigned items -->
  <div class="unassigned-section">
    <div class="unassigned-title">Artículos sin asignar</div>
    <div id="unassigned-list"></div>
  </div>

  <div class="split-bottom">
    <div class="split-progress" id="split-progress">0 de 0 pagado</div>
    <button class="close-split-btn" id="close-all-btn" onclick="closeSplitOrder()" disabled>Cerrar orden completa</button>
  </div>
</div>

<script>
// State
let currentOrdenId=null, currentTotal=0, currentMethod='efectivo';
let splitOrdenId=null, splitTotal=0, splitItems=[], persons=[], personCounter=0;

// Colors for persons
const personColors=['#1aab85','#E8A45A','#7C6FAB','#D46B6B','#5BA08A','#2d1a0e'];

// ─── MAIN LIST ───
async function loadAll(){
  await Promise.all([loadOrders(), loadSummary()]);
}

async function loadOrders(){
  try{
    const res=await fetch("/api/ordenes");
    const orders=await res.json();
    const list=document.getElementById("orders-list");
    if(!orders.length){list.innerHTML="<div class='empty'>No hay ordenes activas</div>";return;}
    let html="";
    for(const o of orders){
      const itemsRes=await fetch("/api/ordenes/"+o.id+"/items");
      const items=await itemsRes.json();
      html+="<div class='order-card'>";
      html+="<div class='order-header'><span class='order-mesa'>"+o.mesa_nombre+"</span><span class='order-total'>$"+parseFloat(o.total).toFixed(2)+"</span></div>";
      html+="<div class='order-time'>"+new Date(o.created_at).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})+"</div>";
      html+="<div class='order-items'>"+items.map(i=>"x"+i.cantidad+" "+i.item_nombre).join("<br>")+"</div>";
      html+="<div class='btn-row'>";
      html+="<button class='pay-btn' onclick='openPayment("+o.id+",\""+o.mesa_nombre+"\","+parseFloat(o.total)+")'>💳 Cobrar</button>";
      html+="<button class='split-btn' onclick='openSplit("+o.id+",\""+o.mesa_nombre+"\","+parseFloat(o.total)+")'>✂️ Dividir</button>";
      html+="</div></div>";
    }
    list.innerHTML=html;
  }catch(e){document.getElementById("orders-list").innerHTML="<div class='empty'>Error al cargar</div>";}
}

async function loadSummary(){
  try{
    const res=await fetch("/api/resumen");
    const data=await res.json();
    document.getElementById("total-ordenes").textContent=data.ordenes||0;
    document.getElementById("total-ventas").textContent="$"+parseFloat(data.total||0).toFixed(2);
  }catch(e){}
}

// ─── PAYMENT MODAL ───
function openPayment(id,mesa,total,subtitle){
  currentOrdenId=id; currentTotal=total; currentMethod='efectivo';
  document.getElementById("modal-subtitle").textContent=subtitle||mesa;
  document.getElementById("modal-total").textContent="$"+total.toFixed(2);
  document.getElementById("payment-modal").classList.add("open");
  document.querySelectorAll(".pay-method").forEach((m,i)=>m.classList.toggle("selected",i===0));
  renderPaymentFields();
}

function closePaymentModal(){
  document.getElementById("payment-modal").classList.remove("open");
  currentOrdenId=null;
}

function selectMethod(method){
  currentMethod=method;
  const methods=['efectivo','tarjeta','mixto'];
  document.querySelectorAll(".pay-method").forEach((m,i)=>m.classList.toggle("selected",methods[i]===method));
  renderPaymentFields();
}

function renderPaymentFields(){
  const fields=document.getElementById("payment-fields");
  if(currentMethod==='efectivo'){
    fields.innerHTML='<div class="field-group"><label class="field-label">Cantidad recibida</label><input type="number" class="field-input" id="efectivo-input" placeholder="$0.00" oninput="calcCambio()" step="0.01"></div><div class="cambio-display"><div class="cambio-label">Cambio a entregar</div><div class="cambio-value" id="cambio-value">$0.00</div></div>';
  } else if(currentMethod==='tarjeta'){
    fields.innerHTML='<div style="background:var(--light);border-radius:10px;padding:14px;text-align:center;margin-bottom:12px"><span style="font-size:13px;color:var(--teal);font-weight:600">Cobrar $'+currentTotal.toFixed(2)+' con tarjeta</span></div>';
  } else if(currentMethod==='mixto'){
    fields.innerHTML='<div class="split-row"><div class="field-group"><label class="field-label">Efectivo</label><input type="number" class="field-input" id="mixto-efectivo" placeholder="$0.00" oninput="calcMixto()" step="0.01"></div><div class="field-group"><label class="field-label">Tarjeta</label><input type="number" class="field-input" id="mixto-tarjeta" placeholder="$0.00" oninput="calcMixto()" step="0.01"></div></div><div class="cambio-display"><div class="cambio-label">Restante / Cambio</div><div class="cambio-value" id="mixto-restante">$0.00</div></div>';
  }
}

function calcCambio(){
  const r=parseFloat(document.getElementById("efectivo-input").value)||0;
  const c=r-currentTotal;
  const el=document.getElementById("cambio-value");
  el.textContent="$"+Math.abs(c).toFixed(2)+(c<0?" (faltan)":"");
  el.className="cambio-value"+(c<0?" negative":"");
}

function calcMixto(){
  const ef=parseFloat(document.getElementById("mixto-efectivo").value)||0;
  const ta=parseFloat(document.getElementById("mixto-tarjeta").value)||0;
  const r=currentTotal-ef-ta;
  const el=document.getElementById("mixto-restante");
  el.textContent="$"+Math.abs(r).toFixed(2)+(r>0?" pendiente":r<0?" cambio":" ✅ exacto");
  el.className="cambio-value"+(r>0?" negative":"");
}

async function confirmarPago(){
  if(currentMethod==='efectivo'){
    const r=parseFloat(document.getElementById("efectivo-input").value)||0;
    if(r<currentTotal){alert("La cantidad recibida es menor al total");return;}
  }
  if(currentMethod==='mixto'){
    const ef=parseFloat(document.getElementById("mixto-efectivo").value)||0;
    const ta=parseFloat(document.getElementById("mixto-tarjeta").value)||0;
    if(ef+ta<currentTotal){alert("La suma no cubre el total");return;}
  }
  if(currentOrdenId){
    await fetch("/api/ordenes/"+currentOrdenId+"/cerrar",{method:"PUT"});
  }
  closePaymentModal();
  loadAll();
  // Mark person as paid if in split mode
  if(window._splitPersonCallback) window._splitPersonCallback();
}

// ─── SPLIT SCREEN ───
async function openSplit(id,mesa,total){
  splitOrdenId=id; splitTotal=total; persons=[]; personCounter=0;
  document.getElementById("split-total-display").textContent="$"+total.toFixed(2);
  document.getElementById("split-screen").classList.add("open");
  // Load items
  const res=await fetch("/api/ordenes/"+id+"/items");
  const rawItems=await res.json();
  // Expand by quantity
  splitItems=[];
  rawItems.forEach(item=>{
    for(let i=0;i<item.cantidad;i++){
      splitItems.push({
        id: item.id+"_"+i,
        nombre: item.item_nombre,
        precio: parseFloat(item.precio),
        assignedTo: null
      });
    }
  });
  renderSplit();
}

function closeSplit(){
  document.getElementById("split-screen").classList.remove("open");
  splitOrdenId=null; splitItems=[]; persons=[];
}

function addPerson(){
  personCounter++;
  persons.push({id:personCounter, name:"Persona "+personCounter, paid:false, color:personColors[(personCounter-1)%personColors.length]});
  renderSplit();
}

function applyEqualSplit(){
  const n=parseInt(document.getElementById("equal-persons").value)||2;
  if(n<2){alert("Mínimo 2 personas");return;}
  // Remove existing persons
  persons=[];personCounter=0;
  for(let i=0;i<n;i++){
    personCounter++;
    persons.push({id:personCounter,name:"Persona "+personCounter,paid:false,color:personColors[i%personColors.length]});
  }
  // Distribute items as evenly as possible
  splitItems.forEach((item,idx)=>{
    item.assignedTo=persons[idx%n].id;
  });
  renderSplit();
}

function assignItem(itemId,personId){
  const item=splitItems.find(i=>i.id===itemId);
  if(item) item.assignedTo=personId;
  renderSplit();
}

function unassignItem(itemId){
  const item=splitItems.find(i=>i.id===itemId);
  if(item) item.assignedTo=null;
  renderSplit();
}

function getPersonSubtotal(personId){
  return splitItems.filter(i=>i.assignedTo===personId).reduce((s,i)=>s+i.precio,0);
}

function renderSplit(){
  // Persons list
  const paidCount=persons.filter(p=>p.paid).length;
  const allPaid=persons.length>0 && persons.every(p=>p.paid);
  const unassignedCount=splitItems.filter(i=>!i.assignedTo).length;

  let personsHtml="";
  persons.forEach(p=>{
    const items=splitItems.filter(i=>i.assignedTo===p.id);
    const subtotal=items.reduce((s,i)=>s+i.precio,0);
    personsHtml+='<div class="person-card">';
    personsHtml+='<div class="person-header"><span class="person-name" style="color:'+p.color+'">● '+p.name+'</span>';
    personsHtml+='<span class="person-subtotal">$'+subtotal.toFixed(2)+'</span>';
    personsHtml+='<span class="person-status '+(p.paid?'paid':'pending')+'">'+(p.paid?'✅ Pagado':'Pendiente')+'</span></div>';
    if(items.length){
      personsHtml+='<div class="person-items">';
      items.forEach(item=>{
        personsHtml+='<div class="person-item-row"><span class="person-item-name">'+item.nombre+'</span><span class="person-item-price">$'+item.precio.toFixed(2)+'</span>';
        if(!p.paid) personsHtml+='<button class="unassign-btn" onclick="unassignItem(\''+item.id+'\')">×</button>';
        personsHtml+='</div>';
      });
      personsHtml+='</div>';
    }
    if(!p.paid && subtotal>0){
      personsHtml+='<button class="person-pay-btn" onclick="payPerson('+p.id+','+subtotal+')">💳 Cobrar $'+subtotal.toFixed(2)+'</button>';
    } else if(p.paid){
      personsHtml+='<button class="person-pay-btn paid" disabled>✅ Pagado</button>';
    }
    personsHtml+='</div>';
  });
  document.getElementById("persons-list").innerHTML=personsHtml;

  // Unassigned items
  const unassigned=splitItems.filter(i=>!i.assignedTo);
  if(unassigned.length && persons.length){
    document.getElementById("unassigned-list").innerHTML=unassigned.map(item=>{
      const btns=persons.map(p=>'<button class="assign-btn" style="background:'+p.color+'20;color:'+p.color+'" onclick="assignItem(\''+item.id+'\','+p.id+')">'+p.name+'</button>').join("");
      return '<div class="unassigned-item"><div class="unassigned-item-header"><span class="unassigned-item-name">'+item.nombre+'</span><span class="unassigned-item-price">$'+item.precio.toFixed(2)+'</span></div><div class="assign-btns">'+btns+'</div></div>';
    }).join("");
  } else if(!persons.length){
    document.getElementById("unassigned-list").innerHTML='<div style="text-align:center;padding:20px;color:var(--gray);font-size:13px">Agrega personas para asignar artículos</div>';
  } else {
    document.getElementById("unassigned-list").innerHTML='<div style="text-align:center;padding:12px;color:var(--teal);font-size:13px;font-weight:600">✅ Todos los artículos asignados</div>';
  }

  // Progress
  document.getElementById("split-progress").textContent=paidCount+" de "+persons.length+" pagado"+(persons.length!==1?"s":"");
  document.getElementById("close-all-btn").disabled=!allPaid||unassignedCount>0;
}

function payPerson(personId,subtotal){
  window._splitPersonCallback=()=>{
    const person=persons.find(p=>p.id===personId);
    if(person) person.paid=true;
    window._splitPersonCallback=null;
    renderSplit();
    // Check if all paid
    if(persons.every(p=>p.paid)){
      document.getElementById("close-all-btn").disabled=false;
    }
  };
  // Open payment modal for this person's amount
  const person=persons.find(p=>p.id===personId);
  openPayment(null, person.name, subtotal, person.name+" — $"+subtotal.toFixed(2));
}

async function closeSplitOrder(){
  await fetch("/api/ordenes/"+splitOrdenId+"/cerrar",{method:"PUT"});
  closeSplit();
  loadAll();
}

loadAll();
setInterval(loadAll,30000);
</script>
