<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orama Café - Corte de Caja</title>
<link rel="stylesheet" href="/css/orama.css">
<style>
  body{max-width:480px;margin:0 auto}
  .content{padding:var(--space-3) var(--space-3) 100px}

  /* DATE SELECTOR */
  .date-card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
  .date-row{display:grid;grid-template-columns:1fr auto;gap:var(--space-2);align-items:end}
  .date-label{font-size:var(--text-xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;display:block;margin-bottom:4px}
  .date-input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-size:var(--text-sm);font-family:var(--font-body);outline:none}
  .date-input:focus{border-color:var(--teal)}

  /* SHIFT INFO */
  .shift-card{background:var(--surface);border-radius:var(--radius);padding:var(--space-3);margin-bottom:12px;box-shadow:var(--shadow)}
  .shift-title{font-size:var(--text-sm);font-weight:700;color:var(--brown);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .shift-date{font-size:var(--text-xs);color:var(--muted);font-weight:400}

  /* STATS */
  .stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}
  .stat-row:last-child{border-bottom:none}
  .stat-name{font-size:var(--text-sm);color:var(--muted)}
  .stat-amount{font-size:var(--text-sm);font-weight:700;color:var(--brown)}
  .stat-row.highlight .stat-name{color:var(--brown);font-weight:600}
  .stat-row.highlight .stat-amount{color:var(--teal);font-size:var(--text-md)}
  .stat-row.total{background:var(--teal-tint);margin:var(--space-2) -16px -16px;padding:14px var(--space-3);border-radius:0 0 var(--radius) var(--radius)}
  .stat-row.total .stat-name{font-size:var(--text-md);font-weight:700;color:var(--teal-dark)}
  .stat-row.total .stat-amount{font-size:var(--text-lg);font-weight:700;color:var(--teal)}

  /* PAYMENT BREAKDOWN */
  .payment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);margin-bottom:12px}
  .payment-card{background:var(--surface);border-radius:var(--radius);padding:12px;text-align:center;box-shadow:var(--shadow)}
  .payment-icon{font-size:20px;margin-bottom:4px}
  .payment-value{font-size:var(--text-md);font-weight:700;color:var(--teal)}
  .payment-label{font-size:var(--text-xs);color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.3px}

  /* ORDERS LIST */
  .orders-card{background:var(--surface);border-radius:var(--radius);padding:var(--space-3);margin-bottom:12px;box-shadow:var(--shadow)}
  .orders-title{font-size:var(--text-sm);font-weight:700;color:var(--brown);margin-bottom:10px}
  .order-row{display:flex;justify-content:space-between;align-items:center;padding:var(--space-2) 0;border-bottom:1px solid #f5f5f5;font-size:var(--text-xs)}
  .order-row:last-child{border-bottom:none}
  .order-mesa{color:var(--brown);font-weight:600}
  .order-time{color:var(--muted)}
  .order-method{padding:2px var(--space-2);border-radius:10px;font-size:var(--text-xs);font-weight:700}
  .method-efectivo{background:var(--teal-tint);color:var(--teal)}
  .method-tarjeta{background:#e8e8f8;color:#5b5bab}
  .method-mixto{background:#fdf0e8;color:var(--warning)}
  .order-total{color:var(--teal);font-weight:700}

  /* CORTE BTN */
  .corte-btn{width:100%;background:var(--brand-gradient);color:#fff;border:none;border-radius:14px;padding:var(--space-3);font-size:var(--text-md);font-weight:700;cursor:pointer;margin-top:4px}
  .corte-btn:active{transform:scale(0.98)}
  .corte-btn.done{background:var(--teal-tint);color:var(--teal);border:2px solid var(--teal)}

  /* PRINT VIEW */
  .print-card{background:var(--surface);border-radius:var(--radius);padding:var(--space-3);margin-bottom:12px;box-shadow:var(--shadow);display:none}
  .print-card.show{display:block}
  .print-header{text-align:center;margin-bottom:12px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
  .print-title{font-size:var(--text-md);font-weight:700;color:var(--brown)}
  .print-sub{font-size:var(--text-xs);color:var(--muted);margin-top:4px}
  .print-line{display:flex;justify-content:space-between;font-size:var(--text-sm);padding:4px 0}
  .print-divider{border:none;border-top:1px dashed var(--line);margin:var(--space-2) 0}
  .print-total{display:flex;justify-content:space-between;font-size:var(--text-md);font-weight:700;color:var(--teal);padding:var(--space-2) 0}
  .print-footer{text-align:center;font-size:var(--text-xs);color:var(--muted);margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
</style>
</head>
<body>
<div class="o-header">
  <button class="btn btn--ghost btn--sm" onclick="location.href='/dashboard.html'" style="margin-bottom:var(--space-2)">← Dashboard</button>
  <h1>🌿 ORAMA CAFÉ</h1>
  <p>Corte de Caja</p>
</div>

<div class="content">
  <!-- Date selector -->
  <div class="date-card">
    <div class="date-row">
      <div>
        <span class="date-label">Fecha del corte</span>
        <input type="date" id="corte-date" class="date-input">
      </div>
      <button class="btn btn--primary" onclick="loadCorte()">Ver</button>
    </div>
  </div>

  <div id="corte-content"><div class="spinner"></div></div>
</div>

<script src="/js/orama.js"></script>
<script>
const today = new Date().toLocaleDateString('en-CA');
document.getElementById('corte-date').value = today;

async function loadCorte(){
  const date = document.getElementById('corte-date').value;
  const content = document.getElementById('corte-content');
  content.innerHTML = '<div class="spinner"></div>';

  try{
    const [resumen, ordenes] = await Promise.all([
      fetch('/api/resumen?date='+date).then(r=>r.json()),
      fetch('/api/ordenes/dia?date='+date).then(r=>r.json())
    ]);

    const totalEfectivo = parseFloat(resumen.total_efectivo||0) + parseFloat(resumen.mixto_efectivo||0);
    const totalTarjeta = parseFloat(resumen.total_tarjeta||0) + parseFloat(resumen.mixto_tarjeta||0);
    const totalVentas = parseFloat(resumen.total||0);
    const numOrdenes = parseInt(resumen.ordenes||0);
    const promedio = numOrdenes > 0 ? totalVentas/numOrdenes : 0;

    const fechaDisplay = new Date(date+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    if(!numOrdenes){
      content.innerHTML = '<div class="empty"><span class="empty__icon">🧾</span>Sin órdenes registradas para esta fecha<span class="empty__hint">Elige otra fecha arriba</span></div>';
      return;
    }

    let html = '';

    // Summary card
    html += '<div class="shift-card">';
    html += '<div class="shift-title">Resumen del día <span class="shift-date">'+fechaDisplay+'</span></div>';
    html += '<div class="stat-row highlight"><span class="stat-name">📋 Total de órdenes</span><span class="stat-amount">'+numOrdenes+'</span></div>';
    html += '<div class="stat-row"><span class="stat-name">📊 Promedio por orden</span><span class="stat-amount">$'+promedio.toFixed(2)+'</span></div>';
    html += '<div class="stat-row total"><span class="stat-name">💰 Total vendido</span><span class="stat-amount">$'+totalVentas.toFixed(2)+'</span></div>';
    html += '</div>';

    // Payment breakdown
    html += '<div class="payment-grid">';
    html += '<div class="payment-card"><div class="payment-icon">💵</div><div class="payment-value">$'+totalEfectivo.toFixed(2)+'</div><div class="payment-label">Efectivo</div></div>';
    html += '<div class="payment-card"><div class="payment-icon">💳</div><div class="payment-value">$'+totalTarjeta.toFixed(2)+'</div><div class="payment-label">Tarjeta</div></div>';
    html += '<div class="payment-card"><div class="payment-icon">🧾</div><div class="payment-value">$'+totalVentas.toFixed(2)+'</div><div class="payment-label">Total</div></div>';
    html += '</div>';

    // Orders list
    if(ordenes.length){
      html += '<div class="orders-card">';
      html += '<div class="orders-title">Detalle de órdenes ('+ordenes.length+')</div>';
      ordenes.forEach(o=>{
        const time = new Date(o.created_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
        html += '<div class="order-row">';
        html += '<span class="order-mesa">'+o.mesa_nombre+'</span>';
        html += '<span class="order-time">'+time+'</span>';
        html += '<span class="order-method method-'+(o.payment_method||'efectivo')+'">'+( o.payment_method==='efectivo'?'Efectivo':o.payment_method==='tarjeta'?'Tarjeta':'Mixto')+'</span>';
        html += '<span class="order-total">$'+parseFloat(o.total).toFixed(2)+'</span>';
        html += '</div>';
      });
      html += '</div>';
    }

    // Print summary card
    html += '<div class="print-card show" id="print-card">';
    html += '<div class="print-header"><div class="print-title">🌿 ORAMA CAFÉ</div><div class="print-sub">Corte de Caja — '+fechaDisplay+'</div></div>';
    html += '<div class="print-line"><span>Órdenes:</span><span>'+numOrdenes+'</span></div>';
    html += '<div class="print-line"><span>Promedio:</span><span>$'+promedio.toFixed(2)+'</span></div>';
    html += '<hr class="print-divider">';
    html += '<div class="print-line"><span>💵 Efectivo:</span><span>$'+totalEfectivo.toFixed(2)+'</span></div>';
    html += '<div class="print-line"><span>💳 Tarjeta:</span><span>$'+totalTarjeta.toFixed(2)+'</span></div>';
    html += '<hr class="print-divider">';
    html += '<div class="print-total"><span>TOTAL:</span><span>$'+totalVentas.toFixed(2)+'</span></div>';
    html += '<div class="print-footer">Generado: '+new Date().toLocaleString('es-MX')+'</div>';
    html += '</div>';

    html += '<button class="corte-btn" onclick="compartirCorte()">📤 Compartir corte</button>';

    content.innerHTML = html;

  }catch(e){
    content.innerHTML='<div class="empty"><span class="empty__icon">⚠️</span>Error al cargar el corte</div>';
    console.log(e);
  }
}

function compartirCorte(){
  const text = document.getElementById('print-card').innerText;
  if(navigator.share){
    navigator.share({title:'Corte de Caja — Orama Café', text});
  } else {
    navigator.clipboard.writeText(text).then(()=>Orama.toast.success('Corte copiado al portapapeles'));
  }
}

loadCorte();
</script>
</body>
</html>
