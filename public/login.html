<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orama Café</title>
<link rel="stylesheet" href="/css/orama.css">
<style>
  /* login-specific: full-bleed brand background + centered card */
  body{
    font-family:var(--font-brand);
    background:var(--brand-gradient);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:var(--space-4);
  }

  .login-card{
    background:rgba(255,255,255,0.97);
    border-radius:var(--radius-lg);
    padding:var(--space-5) var(--space-4);
    width:100%;max-width:380px;
    box-shadow:var(--shadow-lg);
    text-align:center;
  }

  /* Logo area */
  .logo-area{margin-bottom:var(--space-4)}
  .logo-circle{width:80px;height:80px;background:var(--brand-gradient);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-2);font-size:36px}
  .logo-name{font-size:var(--text-xl);font-weight:700;color:var(--brown);letter-spacing:3px}
  .logo-sub{font-size:var(--text-xs);color:var(--muted);letter-spacing:2px;margin-top:var(--space-1)}

  /* PIN pad */
  .pin-display{display:flex;gap:12px;justify-content:center;margin:var(--space-3) 0 var(--space-4)}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--teal);background:transparent;transition:all 0.2s}
  .pin-dot.filled{background:var(--teal);border-color:var(--teal)}

  .pin-label{font-size:var(--text-sm);color:var(--muted);margin-bottom:var(--space-3);font-family:var(--font-body)}

  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:var(--space-3)}
  .num-btn{background:#f5f5f5;border:none;border-radius:14px;padding:18px;font-size:22px;font-weight:700;color:var(--brown);cursor:pointer;font-family:var(--font-brand);transition:all 0.15s}
  .num-btn:active{background:var(--teal-tint);transform:scale(0.95)}
  .num-btn:disabled{opacity:0.45;cursor:default}
  .num-btn.delete{background:#fbe9e9;color:var(--error);font-size:18px}
  .num-btn.empty{background:transparent;cursor:default}

  .error-msg{color:var(--error);font-size:var(--text-sm);font-family:var(--font-body);margin-bottom:12px;min-height:20px}

  /* Role selection */
  .role-screen{display:none}
  .greeting{font-size:var(--text-lg);font-weight:700;color:var(--brown);margin-bottom:var(--space-1)}
  .greeting-sub{font-size:var(--text-sm);color:var(--muted);font-family:var(--font-body);margin-bottom:var(--space-4)}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:var(--space-3)}
  .role-btn{background:#f5f5f5;border:2px solid transparent;border-radius:14px;padding:20px 10px;text-align:center;cursor:pointer;transition:all 0.15s}
  .role-btn:active{transform:scale(0.97);background:var(--teal-tint);border-color:var(--teal)}
  .role-icon{font-size:28px;display:block;margin-bottom:var(--space-2)}
  .role-name{font-size:var(--text-sm);font-weight:700;color:var(--brown);font-family:var(--font-body)}
</style>
</head>
<body>

<div class="login-card">
  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="logo-area">
    <img src="/logo.png" alt="Orama Café" style="width:180px;height:180px;object-fit:contain;margin-bottom:8px;border-radius:16px">
    </div>

    <div class="pin-label" id="pin-label">Ingresa tu PIN</div>
    <div class="pin-display">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="numpad">
      <button class="num-btn" onclick="addPin('1')">1</button>
      <button class="num-btn" onclick="addPin('2')">2</button>
      <button class="num-btn" onclick="addPin('3')">3</button>
      <button class="num-btn" onclick="addPin('4')">4</button>
      <button class="num-btn" onclick="addPin('5')">5</button>
      <button class="num-btn" onclick="addPin('6')">6</button>
      <button class="num-btn" onclick="addPin('7')">7</button>
      <button class="num-btn" onclick="addPin('8')">8</button>
      <button class="num-btn" onclick="addPin('9')">9</button>
      <button class="num-btn empty"></button>
      <button class="num-btn" onclick="addPin('0')">0</button>
      <button class="num-btn delete" onclick="deletePin()">⌫</button>
    </div>
  </div>

  <!-- ROLE SELECTION SCREEN -->
  <div id="role-screen" class="role-screen">
    <div class="logo-area">
      <div class="logo-circle">🌿</div>
    </div>
    <div class="greeting" id="greeting">Hola!</div>
    <div class="greeting-sub" id="greeting-sub">¿Cuál es tu rol hoy?</div>
    <div class="role-grid" id="role-grid"></div>
    <button class="btn btn--secondary btn--block" onclick="logout()">← Cambiar usuario</button>
  </div>
</div>

<script src="/js/orama.js"></script>
<script>
let pin = '';
let currentStaff = null;

// Greetings by name and language
const greetings = {
  'Jorge': { text: 'Hey Jorge! 🌿', sub: "What's your role today?", lang: 'en' },
  'Miguel': { text: 'Hey Miguel! 👋', sub: "What's your role today?", lang: 'en' },
  'Erika': { text: 'Bienvenida Erika ☕', sub: '¿Qué vas a hacer hoy?', lang: 'es' },
  'Karen': { text: 'Hola Karen 👋', sub: '¿Cuál es tu rol hoy?', lang: 'es' }
};

const roles = {
  management: [
    { icon: '🏠', name: 'Dashboard', url: '/dashboard.html' },
    { icon: '📊', name: 'Reportes', url: '/admin.html' },
    { icon: '💰', name: 'Finanzas', url: '/finanzas.html' },
    { icon: '✂️', name: 'Corte', url: '/corte.html' },
    { icon: '🏬', name: 'Insumos', url: '/inventory.html' }
  ],
  staff: [
    { icon: '💳', name: 'Cajero', url: '/cashier.html' },
    { icon: '☕', name: 'Barista', url: '/barra.html' },
    { icon: '🍽️', name: 'Mesero', url: '/' }
  ]
};

function addPin(num) {
  if(pin.length >= 4) return;
  pin += num;
  updateDots();
  if(pin.length === 4) setTimeout(checkPin, 200);
}

function deletePin() {
  pin = pin.slice(0, -1);
  updateDots();
  document.getElementById('error-msg').textContent = '';
}

function updateDots() {
  for(let i = 0; i < 4; i++) {
    document.getElementById('dot-'+i).classList.toggle('filled', i < pin.length);
  }
}

function setBusy(busy) {
  document.querySelectorAll('.num-btn').forEach(b => { if(!b.classList.contains('empty')) b.disabled = busy; });
  document.getElementById('pin-label').textContent = busy ? 'Verificando…' : 'Ingresa tu PIN';
}

async function checkPin() {
  setBusy(true);
  try {
    const res = await fetch('/api/staff/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    const data = await res.json();
    if(data.success) {
      currentStaff = data.staff;
      showRoleScreen();
    } else {
      document.getElementById('error-msg').textContent = data.message || 'PIN incorrecto';
      pin = '';
      updateDots();
    }
  } catch(e) {
    document.getElementById('error-msg').textContent = 'Error de conexión';
    pin = '';
    updateDots();
  } finally {
    setBusy(false);
  }
}

function showRoleScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('role-screen').style.display = 'block';

  const g = greetings[currentStaff.nombre] || {
    text: 'Hola ' + currentStaff.nombre + '! 👋',
    sub: '¿Cuál es tu rol hoy?'
  };
  document.getElementById('greeting').textContent = g.text;
  document.getElementById('greeting-sub').textContent = g.sub;

  const roleList = currentStaff.tipo === 'management' ? roles.management : roles.staff;
  document.getElementById('role-grid').innerHTML = roleList.map(r =>
    '<button class="role-btn" onclick="goToRole(\'' + r.url + '\',\'' + r.name + '\')">' +
    '<span class="role-icon">' + r.icon + '</span>' +
    '<span class="role-name">' + r.name + '</span>' +
    '</button>'
  ).join('');
}

async function goToRole(url, screen) {
  // Log the session
  await fetch('/api/staff/session', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ staff_id: currentStaff.id, screen })
  });
  window.location.href = url;
}

function logout() {
  currentStaff = null;
  pin = '';
  updateDots();
  document.getElementById('error-msg').textContent = '';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('role-screen').style.display = 'none';
}
</script>
</body>
</html>
